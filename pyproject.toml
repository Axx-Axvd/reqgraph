# uv workspace root (not a package itself): packages/core is the reqgraph library + CLI,
# apps/api is the FastAPI service (stub until T-501).
[project]
name = "reqgraph-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["reqgraph", "reqgraph-api", "reqgraph-evals"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "apps/api", "evals"]

[tool.uv.sources]
reqgraph = { workspace = true }
reqgraph-api = { workspace = true }
reqgraph-evals = { workspace = true }

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-recording==0.14.0",
    "pytest-socket==0.8.1",
    "ruff==0.17.1",
    "types-pyyaml==6.0.12.20260906",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["examples", "private"]

[tool.ruff.format]
# Code blocks in docs/ are illustrations from the design; they are not reformatted.
exclude = ["docs/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Russian text is required in check messages, prompts and docs: Cyrillic is not ambiguous here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["packages/core/src", "apps/api/src", "evals"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# lxml, networkx, pydbml and pm4py ship no type hints; stub packages lag behind or do not exist
module = ["lxml", "lxml.*", "networkx", "networkx.*", "pydbml", "pydbml.*", "pm4py", "pm4py.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "evals/tests"]
# Network is blocked by allowing connections only to localhost: asyncio event loops need a
# local socket pair (TCP 127.0.0.1 on Windows), so --disable-socket would break async tests.
addopts = "--strict-markers --allow-hosts=127.0.0.1,::1 -ra"
xfail_strict = true
# pydbml 1.2.1 still calls the old pyparsing API (escChar=...); not our code, nothing to fix here
filterwarnings = ["ignore::pyparsing.warnings.PyparsingDeprecationWarning:pydbml.*"]

[tool.coverage.run]
source = ["reqgraph", "reqgraph_evals"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
