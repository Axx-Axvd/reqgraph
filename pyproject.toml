# uv workspace root (not a package itself): packages/core is the reqgraph library + CLI,
# apps/api is the FastAPI service (stub until T-501).
[project]
name = "reqgraph-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["reqgraph", "reqgraph-api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "apps/api"]

[tool.uv.sources]
reqgraph = { workspace = true }
reqgraph-api = { workspace = true }

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-recording==0.14.0",
    "pytest-socket==0.8.1",
    "ruff==0.17.1",
    "types-pyyaml==6.0.12.20260906",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["examples", "private"]

[tool.ruff.format]
# Code blocks in docs/ are illustrations from the design; they are not reformatted.
exclude = ["docs/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Russian text is required in check messages, prompts and docs: Cyrillic is not ambiguous here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["packages/core/src", "apps/api/src"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["packages/core/tests"]
# --allow-unix-socket: asyncio event loops need a local socketpair; network stays blocked.
addopts = "--strict-markers --disable-socket --allow-unix-socket -ra"
xfail_strict = true

[tool.coverage.run]
source = ["reqgraph"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
