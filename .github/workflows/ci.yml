# CI: ruff, mypy, pytest (no network), web lint and build, migrations + RLS tests, the web e2e.
# Runs on every push and PR.
# Branch protection for main requires the single aggregate check "ci" (see the last job).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/core evals/reqgraph_evals apps/api
      - run: uv run pytest -q --cov
      - name: pre-commit hooks
        if: matrix.os == 'ubuntu-latest'
        run: uv run pre-commit run --all-files

  web:
    name: web (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web lint
      - name: web API types match schemas/openapi.json (T-501)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm -C apps/web gen:api && git diff --exit-code -- apps/web/src/lib/api-types.ts
      - run: pnpm -C apps/web build

  db:
    name: db (supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: start Postgres only (not the whole Supabase stack)
        run: pnpm db:start
      - name: apply migrations and seed
        run: pnpm db:reset
      - name: RLS tests (pgTAP)
        run: pnpm db:test
      # T-501: the API tests that need a database, against the local Supabase Postgres.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: API tests with the database
        env:
          REQGRAPH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: uv run pytest apps/api/tests -m pg -q -p no:cacheprovider

  # T-504: the web app end to end — local Supabase (database, auth, realtime, REST), the API with
  # its worker on stub models (no network, no money), the built site, Playwright in Chromium.
  e2e:
    name: e2e (web + api + supabase)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: start Supabase without the services the test does not use
        run: pnpm supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Supabase settings for the API, the site and the test
        run: |
          pnpm --silent supabase status -o env > supabase.env
          set -a; . ./supabase.env; set +a
          anon="${ANON_KEY:-$PUBLISHABLE_KEY}"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon"
            echo "NEXT_PUBLIC_API_URL=http://127.0.0.1:8000"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "DATABASE_URL=$DB_URL"
            echo "SUPABASE_JWKS_URL=$API_URL/auth/v1/.well-known/jwks.json"
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
          rm supabase.env
      - name: start the API with the worker on stub models
        env:
          REQGRAPH_STUB_MODELS: "1"
          CORS_ORIGINS: http://127.0.0.1:3000
          WORKER_POLL_SECONDS: "0.5"
          EXPORT_OFFLINE: "1"  # no Kroki from CI: documents without scheme pictures
          DEMO_RUNS_PER_DAY: "20"  # one test user runs 4+ times (interview and brief, desktop and phone)
        run: |
          nohup uv run reqgraph-api serve --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          cat api.log
          exit 1
      - run: pnpm -C apps/web exec playwright install --with-deps chromium
      - name: e2e — interview with 3 answers; graph, checks and exports (T-505); smoke (T-506)
        run: pnpm -C apps/web e2e
      - name: memory of the API process after the e2e (Render Free has 512 MB, T-506)
        run: |
          health=$(curl -fsS http://127.0.0.1:8000/health)
          echo "$health"
          echo "API after e2e: $health" >> "$GITHUB_STEP_SUMMARY"
      - name: reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            apps/web/playwright-report
            api.log
          retention-days: 7

  # The image Render runs (T-506): it builds, starts without a database and has pandoc and pm4py.
  docker:
    name: docker (api image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: docker build -f apps/api/Dockerfile -t reqgraph-api .
      - name: the tools inside
        run: |
          docker run --rm reqgraph-api reqgraph --version
          docker run --rm reqgraph-api python -c "import pm4py, pypandoc; print('pandoc', pypandoc.get_pandoc_version())"
      - name: starts and answers /health without a database
        run: |
          docker run -d --name api -p 8000:8000 -e WORKER_ENABLED=false reqgraph-api
          for i in $(seq 1 30); do
            body=$(curl -fsS http://127.0.0.1:8000/health) && break
            sleep 2
          done
          echo "$body"
          echo "$body" | grep -q '"status":"degraded"'
          {
            echo "image: $(docker image inspect reqgraph-api --format '{{.Size}}' | numfmt --to=iec)"
            echo "idle API: $body"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: container log on failure
        if: failure()
        run: docker logs api || true

  # One stable check name for branch protection, whatever the matrix looks like.
  ci:
    if: always()
    needs: [python, web, db, e2e, docker]
    runs-on: ubuntu-latest
    steps:
      - name: all jobs must succeed
        run: |
          echo "python: ${{ needs.python.result }}, web: ${{ needs.web.result }}, db: ${{ needs.db.result }}, e2e: ${{ needs.e2e.result }}, docker: ${{ needs.docker.result }}"
          test "${{ needs.python.result }}" = "success"
          test "${{ needs.web.result }}" = "success"
          test "${{ needs.db.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
          test "${{ needs.docker.result }}" = "success"
