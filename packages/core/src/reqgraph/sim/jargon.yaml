# Словарь ИТ-жаргона для симулятора заказчика (T-316). Составлен до прогонов, разметку по ступеням
# проверяет автор (решение автора 06.11). Ступень — с какого уровня понимания ИТ заказчик понимает
# слово без пояснения:
#   0 — не связан с ИТ: понимает только бытовое («сайт», «телефон», «SMS»), ничего из списка;
#   1 — уверенный пользователь: личный кабинет, пароль, выгрузка в Excel;
#   2 — заказывал ИТ-проекты: интеграция, роли и права, база данных, резервная копия;
#   3 — специалист: понимает всё.
# term — как слово назовёт заказчик, переспрашивая; pattern — регулярное выражение, совпадает с началом
# слова, без учёта регистра. Обычные слова («данные», «система», «заказ», «отчёт», «уведомление»,
# «надёжность») — не жаргон: их понимает каждый.
terms:
  # — понимает уверенный пользователь (1) —
  - {term: личный кабинет, level: 1, pattern: 'личн\w* кабинет'}
  - {term: аккаунт, level: 1, pattern: 'аккаунт|учётн\w* запис|учетн\w* запис'}
  - {term: логин, level: 1, pattern: 'логин'}
  - {term: пароль, level: 1, pattern: 'парол'}
  - {term: выгрузка, level: 1, pattern: 'выгруз'}
  - {term: экспорт, level: 1, pattern: 'экспорт'}
  - {term: импорт, level: 1, pattern: 'импорт'}
  - {term: фильтр, level: 1, pattern: 'фильтр'}
  - {term: интерфейс, level: 1, pattern: 'интерфейс'}
  - {term: браузер, level: 1, pattern: 'браузер'}
  - {term: пуш-уведомления, level: 1, pattern: 'пуш|push'}
  - {term: чат-бот, level: 1, pattern: 'чат-бот|чатбот|бот\b'}
  - {term: QR-код, level: 1, pattern: 'qr'}
  - {term: персональные данные, level: 1, pattern: 'персональн\w* данн'}
  - {term: справочник, level: 1, pattern: 'справочник'}
  - {term: онлайн-оплата, level: 1, pattern: 'онлайн-оплат'}
  - {term: мобильное приложение, level: 1, pattern: 'мобильн\w* приложени'}
  # — понимает тот, кто заказывал ИТ-проекты (2) —
  - {term: интеграция, level: 2, pattern: 'интеграц|интегрир'}
  - {term: внешние системы, level: 2, pattern: 'внешн\w* (систем|сервис)'}
  - {term: база данных, level: 2, pattern: 'баз\w* данн|бд\b|субд'}
  - {term: роли и права, level: 2, pattern: 'рол(и|ей|ям|ями|ях|ь)\b|ролев|прав\w* доступ|разграничени\w* доступ'}
  - {term: авторизация, level: 2, pattern: 'авторизац'}
  - {term: резервная копия, level: 2, pattern: 'резервн\w* копи|бэкап|backup|резервирован'}
  - {term: сервер, level: 2, pattern: 'сервер'}
  - {term: облако, level: 2, pattern: 'облак|облачн'}
  - {term: синхронизация, level: 2, pattern: 'синхрониз'}
  - {term: шифрование, level: 2, pattern: 'шифр'}
  - {term: аудит, level: 2, pattern: 'аудит'}
  - {term: журнал действий, level: 2, pattern: 'журнал\w* (действий|событий|операций)|логирован|\bлоги\b'}
  - {term: CRM, level: 2, pattern: 'crm'}
  - {term: ERP, level: 2, pattern: 'erp'}
  - {term: модуль, level: 2, pattern: 'модул'}
  - {term: админка, level: 2, pattern: 'админк|панел\w* администрат'}
  - {term: дашборд, level: 2, pattern: 'дашборд'}
  - {term: доступность системы, level: 2, pattern: 'доступност'}
  - {term: нагрузка, level: 2, pattern: 'нагрузк'}
  - {term: производительность, level: 2, pattern: 'производительност'}
  - {term: мониторинг, level: 2, pattern: 'мониторинг'}
  - {term: шлюз, level: 2, pattern: 'шлюз'}
  - {term: эквайринг, level: 2, pattern: 'эквайринг'}
  - {term: бизнес-процесс, level: 2, pattern: 'бизнес-процесс'}
  - {term: бизнес-правила, level: 2, pattern: 'бизнес-правил'}
  - {term: сценарии использования, level: 2, pattern: 'сценари\w* использован|пользовательск\w* сценари'}
  - {term: исключительные ситуации, level: 2, pattern: 'исключительн\w* (ситуац|сценари)|нештатн'}
  # — понимает только специалист (3) —
  - {term: API, level: 3, pattern: 'api\b|апи\b'}
  - {term: SLA, level: 3, pattern: 'sla\b'}
  - {term: нефункциональные требования, level: 3, pattern: 'нефункциональн'}
  - {term: функциональные требования, level: 3, pattern: 'функциональн\w* требован'}
  - {term: отказоустойчивость, level: 3, pattern: 'отказоустойчив'}
  - {term: масштабируемость, level: 3, pattern: 'масштабир'}
  - {term: время отклика, level: 3, pattern: 'врем\w* отклик|латентн|задержк\w* ответ'}
  - {term: RPO и RTO, level: 3, pattern: 'rpo\b|rto\b'}
  - {term: репликация, level: 3, pattern: 'реплик'}
  - {term: микросервисы, level: 3, pattern: 'микросервис'}
  - {term: REST, level: 3, pattern: 'rest\b'}
  - {term: JSON и XML, level: 3, pattern: 'json|xml'}
  - {term: вебхук, level: 3, pattern: 'вебхук|webhook'}
  - {term: единый вход, level: 3, pattern: 'sso\b|oauth|ldap|единый вход'}
  - {term: аутентификация, level: 3, pattern: 'аутентификац|двухфакторн|2fa'}
  - {term: сущность, level: 3, pattern: 'сущност'}
  - {term: атрибут, level: 3, pattern: 'атрибут'}
  - {term: транзакция, level: 3, pattern: 'транзакц'}
  - {term: развёртывание, level: 3, pattern: 'развёртыван|развертыван|деплой'}
  - {term: SaaS, level: 3, pattern: 'saas|on-premise|он-прем'}
  - {term: юзабилити, level: 3, pattern: 'юзабилити|usability|\bux\b'}
  - {term: кроссплатформенность, level: 3, pattern: 'кроссплатформ'}
  - {term: адаптивная вёрстка, level: 3, pattern: 'адаптивн\w* (вёрстк|верстк|дизайн)'}
  - {term: метрики качества, level: 3, pattern: 'метрик'}

# Пояснение рядом с термином: заказчик понимает вопрос лишь отчасти — отвечает общими словами, без чисел.
explained:
  - 'например'
  - 'к примеру'
  - 'то есть'
  - 'скажем'
  - 'допустим'
  - 'иначе говоря'
  - 'проще говоря'
  - 'другими словами'
  - 'имею в виду'
