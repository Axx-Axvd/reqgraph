# Словарь размытых формулировок для ISO-001 (свой список проекта, не текст стандарта).
# ru_lemmas — начальные формы: слово ловится в любой форме («быстрого», «удобнее»).
# phrases — сочетания, ищутся в тексте без учёта регистра и лишних пробелов.
# Осторожно: «все», «простой» (это и «время простоя») и подобные НЕ добавлять — ложные срабатывания.
