# Model ladder per role (ADR-011, ADR-013); read by llm/config.py, built by llm/router.py.
# Ids are "<provider>/<model id at that provider>". The first model is primary, the next ones are
# fallbacks on 429 / 5xx / timeout. Updated after probe (T-006, T-601); models verified 2026-10-23
# (minimax-m3.1-flash:free retired 2026-10-22; nemotron-3-super-120b-a12b:free answered 404).
# One model family for all agents with reserves (ADR-017); simulator and judge are another family.
providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY      # models ending with ":free" cost $0 (50 requests/day without credits)
  groq:
    base_url: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY
    free: true
    max_input_tokens: 6000           # 8000 tokens per minute per model: long prompts go to the next step
    output_mode: native              # Groq validates tool calls server-side (400, no retry); JSON schema works
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    key_env: GEMINI_API_KEY
    free: true
    supports_seed: false             # OpenAI-compatible endpoint rejects "seed" (400, checked 2026-10-23)
  ollama:
    base_url: http://localhost:11434/v1
    base_url_env: OLLAMA_BASE_URL
    key_env: null
    free: true

profiles:
  free:                              # development until January (author's decision 2026-10-21, 2026-10-23)
    # Short tasks go to Groq (fast, 1000 requests/day per model); a prompt longer than the provider's
    # max_input_tokens skips Groq up front. Checked live 2026-10-23 on a 27k-token interview:
    # Gemini and nemotron-3.5-super-vl:free found all 3 hidden facts, Groq answers 413.
    "*": [groq/openai/gpt-oss-120b, groq/openai/gpt-oss-20b, openrouter/nvidia/nemotron-3.5-super-vl:free, gemini/gemini-3.5-flash-lite]
    # The analyst reads the whole interview: start where the context is large and the daily limit high.
    analyst: [gemini/gemini-3.5-flash-lite, openrouter/nvidia/nemotron-3.5-super-vl:free, groq/openai/gpt-oss-20b]
    # The Modeler reads every UR and FR too (T-203): the same long-context ladder.
    modeler: [gemini/gemini-3.5-flash-lite, openrouter/nvidia/nemotron-3.5-super-vl:free, groq/openai/gpt-oss-20b]
    # Its second question, use cases and C4 (T-207): the same requirements, the same ladder.
    modeler_views: [gemini/gemini-3.5-flash-lite, openrouter/nvidia/nemotron-3.5-super-vl:free, groq/openai/gpt-oss-20b]
    # Simulator and judge: another model family than every agent (CLAUDE.md, checked by a test).
    # Paid Qwen3.8-27B first (author's decision 2026-11-02): it best picked the hidden requirements
    # a question is about (evals/reports/simprobe-2026-11-02.md); Groq's free tier is the reserve.
    stakeholder: [openrouter/qwen/qwen3.8-27b, groq/qwen/qwen3.8-27b]
    judge: [openrouter/qwen/qwen3.8-27b, groq/qwen/qwen3.8-27b]
  cheap:                             # experiments (January-February): one model for all methods, Gemini as reserve
    "*": [openrouter/deepseek/deepseek-v4-flash, gemini/gemini-3.5-flash-lite]
    stakeholder: [openrouter/qwen/qwen3.8-27b]   # was Llama 3.3 70B and GLM-5.3 Flash: weaker in
    judge: [openrouter/qwen/qwen3.8-27b]         # the probe of 2026-11-02 (52% and 37% against 74%)
  local:                             # offline stand and smoke tests
    "*": [ollama/qwen3:4b]

defaults:
  temperature: 0.2
  timeout_s: 60
  retries: 2
  rate_limit_retries: 3              # every model of the ladder answered 429: wait and ask again
  seed: 42

role_settings:                       # differences from the defaults, by role
  stakeholder:
    temperature: 0.7                 # the simulated client talks like a person (03_agents)

embeddings:                          # recall: matching found requirements to the hidden ones (T-304)
  free: gemini/gemini-embedding-001  # Google AI Studio, free; 3072 numbers per text
  cheap: openrouter/google/gemini-embedding-001  # the same model, paid per token, no daily quota (author 10.11)
  local: ollama/nomic-embed-text

prices:                              # USD per 1M tokens, openrouter.ai 2026-11-02; genai-prices lacks them
  openrouter/qwen/qwen3.8-27b: {input: 0.15, output: 1.875}
  openrouter/deepseek/deepseek-v4-flash: {input: 0.091, output: 0.182}

model_settings:                      # request parameters per model (T-310), sent as extra_body
  # Qwen3.8-27B reasons before answering by default: ~1000-1600 output tokens a call. Without it the
  # simulator named as many requirements and the judge agreed with the author as well (kappa 0.815
  # on 43 labelled references) at 1/6-1/7 of the cost (evals/reports/*-2026-11-02-t310-*.json).
  openrouter/qwen/qwen3.8-27b: {extra_body: {reasoning: {enabled: false}}}

budget:                              # per run; REQGRAPH_RUN_BUDGET_USD overrides run_usd
  run_usd: 0.50
  run_tokens: 800000
