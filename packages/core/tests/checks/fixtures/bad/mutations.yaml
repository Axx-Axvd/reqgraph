# Мутации эталона garage61: что портим и какие проверки обязаны сработать (на каких узлах).
# replace: [файл, было, стало] — замена первого вхождения; add: [файл в копии, файл из fixtures/bad].
# expect: {проверка: [узлы]} — узлы находки (пустой список — находка без узлов).

# --- SCH: схемы моделей ------------------------------------------------------------------------
- name: process_realizes_missing_fr
  replace: [models/processes/PRC-01_booking.process.json, '"realizes": ["FR-002"]', '"realizes": ["FR-099"]']
  expect: {SCH-002: [PRC-01.T03]}
- name: process_unknown_step_type
  replace: [models/processes/PRC-02_reminder.process.json, '"type": "service_task",', '"type": "robot_task",']
  expect: {SCH-002: [PRC-02]}
- name: dbml_syntax_error
  replace: [models/data/erd.dbml, "plate_number varchar [unique, not null]", "plate_number varchar [unique, not null"]
  load_error: erd.dbml   # ERD нужен графу (ENT-xx): проект не читается, `reqgraph check` — код 2

# --- SND: корректность процессов ---------------------------------------------------------------
- name: drop_no_branch_of_g01
  review: true
  replace: [models/processes/PRC-01_booking.process.json, '["G01", "T06", "нет"],', '']
  expect: {SND-001: [PRC-01.T06], SND-003: [PRC-01.G01]}
- name: drop_yes_label
  review: true
  replace: [models/processes/PRC-01_booking.process.json, '["G01", "T04", "да"]', '["G01", "T04"]']
  expect: {SND-003: [PRC-01.G01]}
- name: deadlock_and_closed_by_xor
  add: [models/processes/PRC-90.process.json, processes/deadlock.process.json]
  expect: {SND-002: [PRC-90], SND-003: [PRC-90.G01]}
- name: dead_end_and_lost_step
  add: [models/processes/PRC-91.process.json, processes/dead_end.process.json]
  expect: {SND-001: [PRC-91.T02, PRC-91.T03], SND-003: [PRC-91.G01]}
- name: process_too_wide_for_a_page
  add: [models/processes/PRC-92.process.json, processes/too_wide.process.json]
  expect: {SND-004: [PRC-92]}

# --- ISO: качество требований ------------------------------------------------------------------
# edit: [[файл, id узла, поле, значение], …] — значение null удаляет поле; delete_node: [файл, id].
- name: vague_word_in_fr001
  review: true
  edit: [[requirements/functional.yaml, FR-001, statement, "Система должна быстро показывать клиенту список услуг с длительностью и базовой ценой каждой услуги."]]
  expect: {ISO-001: [FR-001]}
- name: vague_phrase_in_acceptance
  edit: [[requirements/functional.yaml, FR-002, acceptance, ["показываются удобные слоты и т. д."]]]
  expect: {ISO-001: [FR-002]}
- name: two_actions_in_one_fr
  edit: [[requirements/functional.yaml, FR-003, statement, "Система должна создать запись и отправить клиенту SMS с подтверждением."]]
  expect: {ISO-002: [FR-003]}
- name: nfr_metric_removed
  review: true
  edit: [[requirements/nonfunctional.yaml, NFR-002, metric, null]]
  load_error: metric   # у НФТ метрика обязательна по формату узла (T-101): проект не читается
- name: nfr_threshold_without_number
  edit: [[requirements/nonfunctional.yaml, NFR-002, metric, {name: "доля доставленных SMS", unit: "%", threshold: "высокая", method: "отчёт SMS-шлюза"}]]
  expect: {ISO-003: [NFR-002]}
- name: fr_without_acceptance
  edit: [[requirements/functional.yaml, FR-006, acceptance, null]]
  expect: {ISO-003: [FR-006]}
- name: tbd_in_acceptance_of_fr005
  review: true
  replace: [requirements/functional.yaml, '"SMS отправляется не позднее чем через 1 минуту после создания записи"', '"SMS отправляется не позднее TBD"']
  expect: {ISO-004: [FR-005]}

# --- TRC: трассировка --------------------------------------------------------------------------
- name: br003_not_refined
  review: true
  edit: [[requirements/user.yaml, UR-003, refines, null]]
  expect: {TRC-001: [BR-003]}
- name: fr007_not_realized
  review: true
  edit: [[requirements/functional.yaml, FR-007, realized_by, null]]
  expect: {TRC-002: [FR-007], TRC-003: [PRC-02.T01], TRC-004: [FR-007, PRC-02.T01]}
- name: fr010_removed
  review: true
  delete_node: [requirements/functional.yaml, FR-010]
  expect: {TRC-003: [UC-03, ENT-06, ENT-03]}
- name: fr011_refines_missing_ur
  review: true
  edit: [[requirements/functional.yaml, FR-011, refines, [UR-099]]]
  load_error: UR-099   # ссылки на узлы проверяются при сборке графа (T-101): проект не читается
- name: realized_by_missing_process_step
  edit: [[requirements/functional.yaml, FR-001, realized_by, [PRC-01.T99, ENT-02, C4-CNT-01]]]
  expect: {TRC-004: [FR-001, PRC-01.T99, PRC-01.T02], TRC-003: [PRC-01.T02]}
- name: realized_by_missing_attribute
  edit: [[requirements/functional.yaml, FR-003, realized_by, [PRC-01.T04, ENT-05.colour, UC-01, C4-CNT-02, C4-CNT-03]]]
  expect: {TRC-004: [FR-003, ENT-05.colour]}
- name: depends_on_cycle
  edit:
    - [requirements/functional.yaml, FR-001, depends_on, [FR-002]]
    - [requirements/functional.yaml, FR-002, depends_on, [FR-001]]
  expect: {TRC-004: [FR-001, FR-002]}
- name: con002_without_source
  review: true
  edit: [[requirements/constraints.yaml, CON-002, derived_from, null]]
  expect: {TRC-006: [CON-002]}
- name: br001_source_is_a_question
  edit: [[requirements/business.yaml, BR-001, derived_from, [TURN-0003]]]
  expect: {TRC-006: [BR-001, TURN-0003]}
