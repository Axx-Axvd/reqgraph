      \u043B\u0438\u0447\u043D\u044B\u0439 \u043A\u0430\u0431\u0438\u043D\u0435\u0442,
      \u043F\u0430\u0440\u043E\u043B\u044C, \u0432\u044B\u0433\u0440\u0443\u0437\u043A\u0443.
      \u0421\u043B\u043E\u0432\u0430 \u0430\u043D\u0430\u043B\u0438\u0442\u0438\u043A\u0430
      \u0438 \u0440\u0430\u0437\u0440\u0430\u0431\u043E\u0442\u0447\u0438\u043A\u0430
