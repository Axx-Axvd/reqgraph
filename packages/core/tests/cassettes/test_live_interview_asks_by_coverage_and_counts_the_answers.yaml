      \u043F\u0435\u0440\u0435\u0447\u043D\u0435\u043C \u0438\u0437\u0432\u0435\u0441\u0442\u043D\u043E\u0433\u043E:
      \xAB\u043A\u0442\u043E \u0435\u0449\u0451, \u043A\u0440\u043E\u043C\u0435 \u0432\u0440\u0430\u0447\u0435\u0439\xBB
      \u043E\u0442\u0440\u0435\u0437\u0430\u0435\u0442 \u0432\u0441\u0451, \u0447\u0442\u043E
