      \u0441\u0438\u0441\u0442\u0435\u043C\u044B\xBB, \xAB\u0440\u043E\u043B\u0438
      \u0438 \u043F\u0440\u0430\u0432\u0430\xBB, \xAB\u0434\u043E\u0441\u0442\u0443\u043F\u043D\u043E\u0441\u0442\u044C\xBB,
      \xAB\u043D\u0430\u0433\u0440\u0443\u0437\u043A\u0430\xBB, \xAB\u0431\u0438\u0437\u043D\u0435\u0441-\u043F\u0440\u0430\u0432\u0438\u043B\u0430\xBB,
      \xAB\u043D\u0435\u0444\u0443\u043D\u043A\u0446\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u0435
      \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u044F\xBB) \u0435\u043C\u0443
      \u043D\u0435\u043F\u043E\u043D\u044F\u0442\u043D\u044B: \u0433\u043E\u0432\u043E\u0440\u0438
      \u0447\u0435\u0440\u0435\u0437 \u0435\u0433\u043E \u0440\u0430\u0431\u043E\u0442\u0443
      \u0438 \u0441\u043B\u0443\u0447\u0430\u0438 \u0438\u0437 \u0436\u0438\u0437\u043D\u0438.\\n\u0415\u0441\u043B\u0438
      \u0431\u0435\u0437 \u0441\u043B\u043E\u0432\u0430 \u043D\u0435 \u043E\u0431\u043E\u0439\u0442\u0438\u0441\u044C
      \u2014 \u043F\u043E\u044F\u0441\u043D\u0438 \u0435\u0433\u043E \u043F\u0440\u0438\u043C\u0435\u0440\u043E\u043C
      \u0441\u0440\u0430\u0437\u0443 \u043F\u043E\u0441\u043B\u0435 \u0441\u043B\u043E\u0432\u0430:
      \xAB\u043B\u0438\u0447\u043D\u044B\u0439 \u043A\u0430\u0431\u0438\u043D\u0435\u0442
      \u2014 \u0441\u0442\u0440\u0430\u043D\u0438\u0446\u0430, \u0433\u0434\u0435
