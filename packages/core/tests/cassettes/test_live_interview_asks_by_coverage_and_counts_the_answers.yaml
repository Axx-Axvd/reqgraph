      \u041F\u0440\u0430\u0432\u0438\u043B\u0430 \u0432\u043E\u043F\u0440\u043E\u0441\u0430\\n\\n1.
      \u0421\u043F\u0440\u0430\u0448\u0438\u0432\u0430\u0439 \u043F\u0440\u043E \u043F\u0435\u0440\u0432\u0443\u044E
      \u043E\u0431\u043B\u0430\u0441\u0442\u044C \u0438\u0437 \u0441\u043F\u0438\u0441\u043A\u0430
      \u0432\u044B\u0448\u0435, \u0435\u0441\u043B\u0438 \u043F\u043E\u0441\u043B\u0435\u0434\u043D\u0438\u0439
      \u043E\u0442\u0432\u0435\u0442 \u043D\u0435 \u0442\u0440\u0435\u0431\u0443\u0435\u0442
      \u0443\u0442\u043E\u0447\u043D\u0435\u043D\u0438\u044F. \u0423\u0442\u043E\u0447\u043D\u0435\u043D\u0438\u0435
      \u043D\u0443\u0436\u043D\u043E, \u0435\u0441\u043B\u0438 \u043E\u0442\u0432\u0435\u0442
      \u0440\u0430\u0437\u043C\u044B\u0442\u044B\u0439 (\xAB\u0431\u044B\u0441\u0442\u0440\u043E\xBB,
      \xAB\u0443\u0434\u043E\u0431\u043D\u043E\xBB, \xAB\u043C\u043D\u043E\u0433\u043E\xBB),
      \u0431\u0435\u0437 \u0447\u0438\u0441\u043B\u0430 \u0442\u0430\u043C, \u0433\u0434\u0435
      \u043D\u0443\u0436\u043D\u043E \u0447\u0438\u0441\u043B\u043E, \u0438\u043B\u0438
      \u043F\u0440\u043E\u0442\u0438\u0432\u043E\u0440\u0435\u0447\u0438\u0442 \u0441\u043A\u0430\u0437\u0430\u043D\u043D\u043E\u043C\u0443
      \u0440\u0430\u043D\u044C\u0448\u0435.\\n2. \u0415\u0441\u043B\u0438 \u043E\u0431
      \u043E\u0431\u043B\u0430\u0441\u0442\u0438 \u0435\u0449\u0451 \u043D\u0435 \u0441\u043F\u0440\u0430\u0448\u0438\u0432\u0430\u043B\u0438
      \u2014 \u0437\u0430\u0434\u0430\u0439 \u0448\u0438\u0440\u043E\u043A\u0438\u0439
      \u0432\u043E\u043F\u0440\u043E\u0441 \u043E\u0431\u043E \u0432\u0441\u0435\u0439
      \u043E\u0431\u043B\u0430\u0441\u0442\u0438: \xAB\u041A\u0430\u043A\u0438\u0435
      \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u044F \u0443 \u0432\u0430\u0441
      \u043A \u0441\u043A\u043E\u0440\u043E\u0441\u0442\u0438, \u0434\u043E\u0441\u0442\u0443\u043F\u043D\u043E\u0441\u0442\u0438
      \u0438 \u0443\u0434\u043E\u0431\u0441\u0442\u0432\u0443 \u0441\u0438\u0441\u0442\u0435\u043C\u044B?\xBB,
      \xAB\u041A\u0430\u043A\u0438\u0435 \u043F\u0440\u0430\u0432\u0438\u043B\u0430
      \u0434\u0435\u0439\u0441\u0442\u0432\u0443\u044E\u0442 \u043F\u0440\u0438 \u0437\u0430\u043F\u0438\u0441\u0438
      \u0438 \u043E\u043F\u043B\u0430\u0442\u0435?\xBB. \u041F\u0435\u0440\u0435\u0447\u0438\u0441\u043B\u0438\u0442\u044C
      \u0441\u0442\u043E\u0440\u043E\u043D\u044B \u043E\u0434\u043D\u043E\u0439 \u043E\u0431\u043B\u0430\u0441\u0442\u0438
      \u043C\u043E\u0436\u043D\u043E \u2014 \u044D\u0442\u043E \u0432\u0441\u0451
      \u0435\u0449\u0451 \u043E\u0434\u0438\u043D \u0432\u043E\u043F\u0440\u043E\u0441.\\n3.
      \u0415\u0441\u043B\u0438 \u043E\u0431 \u043E\u0431\u043B\u0430\u0441\u0442\u0438
      \u0443\u0436\u0435 \u0441\u043F\u0440\u0430\u0448\u0438\u0432\u0430\u043B\u0438
      \u2014 \u0441\u043F\u0440\u043E\u0441\u0438 \u043E \u0442\u043E\u043C, \u0447\u0435\u0433\u043E
      \u043D\u0435\u0442 \u0432 <facts>: \u0447\u0442\u043E \u0435\u0449\u0451 \u0432\u0430\u0436\u043D\u043E,
      \u0447\u0442\u043E \u043F\u0440\u043E\u0438\u0441\u0445\u043E\u0434\u0438\u0442
      \u0432 \u0434\u0440\u0443\u0433\u043E\u043C \u0441\u043B\u0443\u0447\u0430\u0435,
      \u0447\u0442\u043E \u0432\u0438\u0434\u0438\u0442 \u0438 \u043C\u043E\u0436\u0435\u0442
      \u0434\u0435\u043B\u0430\u0442\u044C \u043A\u0430\u0436\u0434\u0430\u044F \u0438\u0437
      \u043D\u0430\u0437\u0432\u0430\u043D\u043D\u044B\u0445 \u0440\u043E\u043B\u0435\u0439.
      \u041D\u0435 \u0441\u043F\u0440\u0430\u0448\u0438\u0432\u0430\u0439 \u043E \u0442\u043E\u043C,
      \u0447\u0442\u043E \u0443\u0436\u0435 \u0437\u0430\u043F\u0438\u0441\u0430\u043D\u043E,
      \u0438 \u043D\u0435 \u0441\u0443\u0436\u0430\u0439 \u0432\u043E\u043F\u0440\u043E\u0441
      \u043F\u0435\u0440\u0435\u0447\u043D\u0435\u043C \u0438\u0437\u0432\u0435\u0441\u0442\u043D\u043E\u0433\u043E:
      \xAB\u043A\u0442\u043E \u0435\u0449\u0451, \u043A\u0440\u043E\u043C\u0435 \u0432\u0440\u0430\u0447\u0435\u0439\xBB
      \u043E\u0442\u0440\u0435\u0437\u0430\u0435\u0442 \u0432\u0441\u0451, \u0447\u0442\u043E
      \u0432\u0430\u0436\u043D\u043E \u043E \u0441\u0430\u043C\u0438\u0445 \u0432\u0440\u0430\u0447\u0430\u0445.\\n4.
      \u041E\u0434\u0438\u043D \u0432\u043E\u043F\u0440\u043E\u0441 \u2014 \u043E\u0434\u043D\u0430
      \u0442\u0435\u043C\u0430. \u0411\u0435\u0437 \u0441\u043F\u0438\u0441\u043A\u043E\u0432
      \u0438\u0437 \u043D\u0435\u0441\u043A\u043E\u043B\u044C\u043A\u0438\u0445 \u0432\u043E\u043F\u0440\u043E\u0441\u043E\u0432.\\n5.
      \u0412\u043E\u043F\u0440\u043E\u0441 \u043E\u0442\u043A\u0440\u044B\u0442\u044B\u0439
      \u0438 \u043A\u043E\u043D\u043A\u0440\u0435\u0442\u043D\u044B\u0439: \xAB\u043A\u0430\u043A\xBB,
      \xAB\u0447\u0442\u043E \u043F\u0440\u043E\u0438\u0441\u0445\u043E\u0434\u0438\u0442,
      \u0435\u0441\u043B\u0438\xBB, \xAB\u0441\u043A\u043E\u043B\u044C\u043A\u043E\xBB.
      \u041D\u0435 \u043F\u043E\u0434\u0441\u043A\u0430\u0437\u044B\u0432\u0430\u0439
      \u043E\u0442\u0432\u0435\u0442 \u0438 \u043D\u0435 \u043F\u0440\u0435\u0434\u043B\u0430\u0433\u0430\u0439
      \u0433\u043E\u0442\u043E\u0432\u044B\u0445 \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u0439
      (\xAB\u0412\u0430\u043C \u0432\u0435\u0434\u044C \u043D\u0443\u0436\u043D\u0430
      SMS-\u0440\u0430\u0441\u0441\u044B\u043B\u043A\u0430?\xBB \u2014 \u043D\u0435\u043B\u044C\u0437\u044F).\\n6.
      \u041D\u0435 \u043F\u043E\u0432\u0442\u043E\u0440\u044F\u0439 \u0443\u0436\u0435
      \u0437\u0430\u0434\u0430\u043D\u043D\u044B\u0435 \u0432\u043E\u043F\u0440\u043E\u0441\u044B
      (\u043E\u043D\u0438 \u0432 <asked>).\\n7. \u0415\u0441\u043B\u0438 \u0435\u0441\u0442\u044C
      \u0434\u043E\u043F\u0443\u0449\u0435\u043D\u0438\u044F \u0430\u043D\u0430\u043B\u0438\u0442\u0438\u043A\u0430
