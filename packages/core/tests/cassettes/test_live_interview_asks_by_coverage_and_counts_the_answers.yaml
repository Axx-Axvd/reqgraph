      \u0437\u0430\u043F\u0438\u0441\u0438\xBB.\\n\\n\u0412\u043E\u043F\u0440\u043E\u0441
      2 \u0438\u0437 \u043D\u0435 \u0431\u043E\u043B\u0435\u0435 \u0447\u0435\u043C
      40.\\n\\n<asked>\\n- \u0427\u0442\u043E \u0434\u043E\u043B\u0436\u043D\u043E
