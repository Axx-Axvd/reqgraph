      \u0437\u0430\u043A\u0430\u0437\u0447\u0438\u043A\u0430 \u043F\u043E\u0434\u0442\u0432\u0435\u0440\u0434\u0438\u0442\u044C
      \u043E\u0434\u043D\u043E \u0438\u0437 \u043D\u0438\u0445 \u2014 \u0441\u0432\u043E\u0438\u043C\u0438
      \u0441\u043B\u043E\u0432\u0430\u043C\u0438, \u0431\u0435\u0437 id.\\n8. \u041F\u0438\u0448\u0438
      \u043F\u043E-\u0440\u0443\u0441\u0441\u043A\u0438, \u043A\u043E\u0440\u043E\u0442\u043A\u043E:
