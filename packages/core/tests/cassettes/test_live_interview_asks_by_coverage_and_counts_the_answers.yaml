      \u043E\u0431\u043E \u0432\u0441\u0435\u0439 \u043E\u0431\u043B\u0430\u0441\u0442\u0438,
      \u043D\u0430\u043F\u0440\u0438\u043C\u0435\u0440 \xAB\u041A\u0430\u043A\u0438\u0435
      \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u044F \u0443 \u0432\u0430\u0441
      \u043A \u0441\u043A\u043E\u0440\u043E\u0441\u0442\u0438, \u0434\u043E\u0441\u0442\u0443\u043F\u043D\u043E\u0441\u0442\u0438
      \u0438 \u0443\u0434\u043E\u0431\u0441\u0442\u0432\u0443 \u0441\u0438\u0441\u0442\u0435\u043C\u044B?\xBB.
      \u041F\u0435\u0440\u0435\u0447\u0438\u0441\u043B\u0438\u0442\u044C \u0441\u0442\u043E\u0440\u043E\u043D\u044B
      \u043E\u0434\u043D\u043E\u0439 \u043E\u0431\u043B\u0430\u0441\u0442\u0438 \u043C\u043E\u0436\u043D\u043E
      \u2014 \u044D\u0442\u043E \u0432\u0441\u0451 \u0435\u0449\u0451 \u043E\u0434\u0438\u043D
      \u0432\u043E\u043F\u0440\u043E\u0441.\\n\\n\u0417\u0430\u043F\u0438\u0441\u0430\u043D\u043E
      \u043E\u0431 \u043E\u0431\u043B\u0430\u0441\u0442\u0438 exceptions (\u0441\u043A\u043E\u043B\u044C\u043A\u043E
      \u0444\u0430\u043A\u0442\u043E\u0432 \u0435\u0441\u0442\u044C / \u0441\u043A\u043E\u043B\u044C\u043A\u043E
      \u043D\u0443\u0436\u043D\u043E: 0 / 3):\\n<facts area=\\\"exceptions\\\">\\n\u043F\u043E\u043A\u0430
      \u043D\u0438\u0447\u0435\u0433\u043E\\n</facts>\\n\\n# \u0421\u0442\u0443\u043F\u0435\u043D\u044C
      \u044F\u0437\u044B\u043A\u0430: 0\\n\\n- \u0421\u0442\u0443\u043F\u0435\u043D\u044C
      0 \u2014 \u043E\u0431\u044B\u0447\u043D\u044B\u0439 \u0432\u043E\u043F\u0440\u043E\u0441;
      \u0442\u0435\u0440\u043C\u0438\u043D\u044B \u043C\u043E\u0436\u043D\u043E, \u0435\u0441\u043B\u0438
      \u0431\u0435\u0437 \u043D\u0438\u0445 \u043D\u0435 \u043E\u0431\u043E\u0439\u0442\u0438\u0441\u044C.\\n-
      \u0421\u0442\u0443\u043F\u0435\u043D\u044C 1 \u2014 \u0431\u0435\u0437 \u0418\u0422-\u0442\u0435\u0440\u043C\u0438\u043D\u043E\u0432,
      \u0441\u043B\u043E\u0432\u0430\u043C\u0438 \u0438\u0437 \u0434\u0435\u043B\u0430
      \u0437\u0430\u043A\u0430\u0437\u0447\u0438\u043A\u0430: \xAB\u0441\u0432\u044F\u0437\u044C
      \u0441 1\u0421\xBB, \u0430 \u043D\u0435 \xAB\u0438\u043D\u0442\u0435\u0433\u0440\u0430\u0446\u0438\u044F\xBB;
      \xAB\u043A\u0442\u043E \u0447\u0442\u043E \u043C\u043E\u0436\u0435\u0442 \u0434\u0435\u043B\u0430\u0442\u044C
      \u0432 \u0441\u0438\u0441\u0442\u0435\u043C\u0435\xBB, \u0430 \u043D\u0435 \xAB\u0440\u043E\u043B\u0438
      \u0438 \u043F\u0440\u0430\u0432\u0430\xBB.\\n- \u0421\u0442\u0443\u043F\u0435\u043D\u044C
      2 \u2014 \u043A\u0430\u043A \u0441\u0442\u0443\u043F\u0435\u043D\u044C 1, \u0438
      \u043E\u043F\u0438\u0448\u0438 \u0441\u043B\u0443\u0447\u0430\u0439 \u0438\u0437
      \u0434\u0435\u043B\u0430 \u0441\u0430\u043C\u043E\u0433\u043E \u0437\u0430\u043A\u0430\u0437\u0447\u0438\u043A\u0430
      (\u0438\u0437 \u0442\u043E\u0433\u043E, \u0447\u0442\u043E \u043E\u043D \u0440\u0430\u0441\u0441\u043A\u0430\u0437\u0430\u043B
      \u0432 <turns> \u0438 <facts>), \u0441\u043F\u0440\u043E\u0441\u0438, \u043A\u0430\u043A
      \u0443 \u043D\u0435\u0433\u043E \u0432 \u044D\u0442\u043E\u043C \u0441\u043B\u0443\u0447\u0430\u0435.
      \u0427\u0443\u0436\u0438\u0445 \u043F\u0440\u0438\u043C\u0435\u0440\u043E\u0432
      \u043D\u0435 \u043F\u0440\u0438\u0434\u0443\u043C\u044B\u0432\u0430\u0439.\\n-
      \u0421\u0442\u0443\u043F\u0435\u043D\u044C 3 \u2014 \u043F\u0440\u0435\u0434\u043B\u043E\u0436\u0438
      2\u20133 \u043E\u0431\u0449\u0438\u0445 \u0432\u0430\u0440\u0438\u0430\u043D\u0442\u0430
      \u043D\u0430 \u0432\u044B\u0431\u043E\u0440, \u0431\u0435\u0437 \u0447\u0438\u0441\u0435\u043B,
      \u0438 \u0437\u0430\u043A\u043E\u043D\u0447\u0438 \u0441\u043B\u043E\u0432\u0430\u043C\u0438
      \xAB\u0438\u043B\u0438 \u0443 \u0432\u0430\u0441 \u043F\u043E-\u0434\u0440\u0443\u0433\u043E\u043C\u0443?\xBB.
      \u0412\u0430\u0440\u0438\u0430\u043D\u0442\u044B \u043D\u0430 \u0432\u044B\u0431\u043E\u0440
      \u2014 \u0442\u043E\u043B\u044C\u043A\u043E \u043D\u0430 \u044D\u0442\u043E\u0439
      \u0441\u0442\u0443\u043F\u0435\u043D\u0438.\\n\\n\u0413\u043E\u0432\u043E\u0440\u0438
      \u043D\u0430 \u0441\u0442\u0443\u043F\u0435\u043D\u0438 0.\\n\\n# \u041F\u0440\u0430\u0432\u0438\u043B\u0430
      \u0432\u043E\u043F\u0440\u043E\u0441\u0430\\n\\n1. \u041E\u0434\u0438\u043D
      \u0432\u043E\u043F\u0440\u043E\u0441 \u2014 \u043E\u0434\u043D\u0430 \u0442\u0435\u043C\u0430.
      \u0411\u0435\u0437 \u0441\u043F\u0438\u0441\u043A\u043E\u0432 \u0438\u0437 \u043D\u0435\u0441\u043A\u043E\u043B\u044C\u043A\u0438\u0445
      \u0432\u043E\u043F\u0440\u043E\u0441\u043E\u0432.\\n2. \u0412\u043E\u043F\u0440\u043E\u0441
      \u043E\u0442\u043A\u0440\u044B\u0442\u044B\u0439 \u0438 \u043A\u043E\u043D\u043A\u0440\u0435\u0442\u043D\u044B\u0439:
      \xAB\u043A\u0430\u043A\xBB, \xAB\u0447\u0442\u043E \u043F\u0440\u043E\u0438\u0441\u0445\u043E\u0434\u0438\u0442,
      \u0435\u0441\u043B\u0438\xBB, \xAB\u0441\u043A\u043E\u043B\u044C\u043A\u043E\xBB.
      \u041D\u0435 \u043F\u043E\u0434\u0441\u043A\u0430\u0437\u044B\u0432\u0430\u0439
      \u043E\u0442\u0432\u0435\u0442 \u0438 \u043D\u0435 \u043F\u0440\u0435\u0434\u043B\u0430\u0433\u0430\u0439
      \u0433\u043E\u0442\u043E\u0432\u044B\u0445 \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u0439
      (\xAB\u0412\u0430\u043C \u0432\u0435\u0434\u044C \u043D\u0443\u0436\u043D\u0430
      SMS-\u0440\u0430\u0441\u0441\u044B\u043B\u043A\u0430?\xBB \u2014 \u043D\u0435\u043B\u044C\u0437\u044F).
      \u041D\u0435 \u043F\u0435\u0440\u0435\u0447\u0438\u0441\u043B\u044F\u0439 \u0432
      \u0432\u043E\u043F\u0440\u043E\u0441\u0435 \u043F\u0440\u0438\u043C\u0435\u0440\u043E\u0432,
      \u043A\u043E\u0442\u043E\u0440\u044B\u0445 \u0437\u0430\u043A\u0430\u0437\u0447\u0438\u043A
      \u043D\u0435 \u043D\u0430\u0437\u044B\u0432\u0430\u043B (\xAB\u043D\u0430\u043F\u0440\u0438\u043C\u0435\u0440,
      \u043C\u0435\u0434\u0438\u0446\u0438\u043D\u0441\u043A\u0438\u0435 \u043A\u0430\u0440\u0442\u044B,
      \u0430\u043D\u0430\u043B\u0438\u0437\u044B, \u0444\u043E\u0442\u043E\u0433\u0440\u0430\u0444\u0438\u0438\xBB):
      \u0441\u043F\u0440\u0430\u0448\u0438\u0432\u0430\u0439 \u043E \u0442\u043E\u043C,
      \u0447\u0442\u043E \u0435\u0441\u0442\u044C \u0443 \u043D\u0435\u0433\u043E.
      \u0418\u0441\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u0435 \u043E\u0434\u043D\u043E
      \u2014 \u0441\u0442\u0443\u043F\u0435\u043D\u044C 3: \u0442\u0430\u043C \u043E\u0431\u0449\u0438\u0435
      \u0432\u0430\u0440\u0438\u0430\u043D\u0442\u044B \u043D\u0430 \u0432\u044B\u0431\u043E\u0440
      \u0441 \xAB\u0438\u043B\u0438 \u0443 \u0432\u0430\u0441 \u043F\u043E-\u0434\u0440\u0443\u0433\u043E\u043C\u0443?\xBB.\\n3.
      \u041D\u0435 \u0441\u043F\u0440\u0430\u0448\u0438\u0432\u0430\u0439 \u043E \u0442\u043E\u043C,
      \u0447\u0442\u043E \u0443\u0436\u0435 \u0437\u0430\u043F\u0438\u0441\u0430\u043D\u043E,
      \u0438 \u043D\u0435 \u0441\u0443\u0436\u0430\u0439 \u0432\u043E\u043F\u0440\u043E\u0441
      \u043F\u0435\u0440\u0435\u0447\u043D\u0435\u043C \u0438\u0437\u0432\u0435\u0441\u0442\u043D\u043E\u0433\u043E:
      \xAB\u043A\u0442\u043E \u0435\u0449\u0451, \u043A\u0440\u043E\u043C\u0435 \u0432\u0440\u0430\u0447\u0435\u0439\xBB
      \u043E\u0442\u0440\u0435\u0437\u0430\u0435\u0442 \u0432\u0441\u0451, \u0447\u0442\u043E
      \u0432\u0430\u0436\u043D\u043E \u043E \u0441\u0430\u043C\u0438\u0445 \u0432\u0440\u0430\u0447\u0430\u0445.\\n4.
      \u041D\u0435 \u043F\u043E\u0432\u0442\u043E\u0440\u044F\u0439 \u0443\u0436\u0435
      \u0437\u0430\u0434\u0430\u043D\u043D\u044B\u0435 \u0432\u043E\u043F\u0440\u043E\u0441\u044B
      (\u043E\u043D\u0438 \u0432 <asked>).\\n5. \u0415\u0441\u043B\u0438 \u0435\u0441\u0442\u044C
      \u0434\u043E\u043F\u0443\u0449\u0435\u043D\u0438\u044F \u0430\u043D\u0430\u043B\u0438\u0442\u0438\u043A\u0430
      (<assumptions>) \u043E\u0431 \u044D\u0442\u043E\u0439 \u043E\u0431\u043B\u0430\u0441\u0442\u0438,
      \u043C\u043E\u0436\u043D\u043E \u043F\u043E\u043F\u0440\u043E\u0441\u0438\u0442\u044C
      \u0437\u0430\u043A\u0430\u0437\u0447\u0438\u043A\u0430 \u043F\u043E\u0434\u0442\u0432\u0435\u0440\u0434\u0438\u0442\u044C
      \u043E\u0434\u043D\u043E \u0438\u0437 \u043D\u0438\u0445 \u2014 \u0441\u0432\u043E\u0438\u043C\u0438
      \u0441\u043B\u043E\u0432\u0430\u043C\u0438, \u0431\u0435\u0437 id.\\n6. \u041F\u0438\u0448\u0438
      \u043F\u043E-\u0440\u0443\u0441\u0441\u043A\u0438, \u043A\u043E\u0440\u043E\u0442\u043A\u043E:
      1\u20132 \u043F\u0440\u0435\u0434\u043B\u043E\u0436\u0435\u043D\u0438\u044F,
      \u043D\u0430 \xAB\u0432\u044B\xBB.\\n\\n\u0412\u043E\u043F\u0440\u043E\u0441
      3 \u0438\u0437 \u043D\u0435 \u0431\u043E\u043B\u0435\u0435 \u0447\u0435\u043C
      40.\\n\\n<asked>\\n- \u041A\u0430\u043A\u0438\u0435 \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u044F
      \u0443 \u0432\u0430\u0441 \u043A \u0441\u043A\u043E\u0440\u043E\u0441\u0442\u0438
      \u0440\u0430\u0431\u043E\u0442\u044B \u0441\u0438\u0441\u0442\u0435\u043C\u044B,
      \u0435\u0451 \u0434\u043E\u0441\u0442\u0443\u043F\u043D\u043E\u0441\u0442\u0438,
      \u0431\u0435\u0437\u043E\u043F\u0430\u0441\u043D\u043E\u0441\u0442\u0438 \u0438
      \u0443\u0434\u043E\u0431\u0441\u0442\u0432\u0443 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u043D\u0438\u044F?\\n-
      \u0421\u043A\u043E\u043B\u044C\u043A\u043E \u0432\u0440\u0435\u043C\u0435\u043D\u0438
      \u0432\u044B \u0441\u0447\u0438\u0442\u0430\u0435\u0442\u0435 \u043F\u0440\u0438\u0435\u043C\u043B\u0435\u043C\u044B\u043C,
      \u0447\u0442\u043E\u0431\u044B \u043F\u0430\u0446\u0438\u0435\u043D\u0442 \u0441\u043C\u043E\u0433
      \u0437\u0430\u043F\u0438\u0441\u0430\u0442\u044C\u0441\u044F \u043E\u043D\u043B\u0430\u0439\u043D
      \u0431\u0435\u0437 \u0437\u0430\u0434\u0435\u0440\u0436\u0435\u043A?\\n</asked>\\n\\n<assumptions>\\n\u043D\u0435\u0442\\n</assumptions>\\n\\n#
