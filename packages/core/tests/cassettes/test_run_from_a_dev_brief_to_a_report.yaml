        \u043A\u043B\u0438\u043D\u0438\u043A\u0438, \u043E\u0442\u0432\u0435\u0447\u0430\u044E\u0449\u0438\u0439
        \u0437\u0430 \u043F\u0440\u043E\u0441\u043C\u043E\u0442\u0440 \u0438 \u043A\u043E\u0440\u0440\u0435\u043A\u0442\u0438\u0440\u043E\u0432\u043A\u0443
        \u0440\u0430\u0441\u043F\u0438\u0441\u0430\u043D\u0438\u044F \u0432\u0440\u0430\u0447\u0435\u0439.\\\"},{\\\"term\\\":\\\"\u0412\u0440\u0430\u0447\\\",\\\"definition\\\":\\\"\u0421\u0442\u043E\u043C\u0430\u0442\u043E\u043B\u043E\u0433,
