      \u0441\u0438\u0441\u0442\u0435\u043C\u0430. \u0426\u0435\u043B\u044C \u0441
      \u0447\u0438\u0441\u043B\u043E\u043C: \u0447\u0442\u043E \u0438\u0437\u043C\u0435\u0440\u044F\u0435\u043C,
      \u0435\u0434\u0438\u043D\u0438\u0446\u0430, \u0431\u044B\u043B\u043E (\u0435\u0441\u043B\u0438
