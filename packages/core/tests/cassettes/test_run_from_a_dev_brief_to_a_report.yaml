      FR \u0443\u0442\u043E\u0447\u043D\u044F\u0435\u0442 UR: refines \u2192 UR.\\n-
      **NFR** \u2014 \u043D\u0435\u0444\u0443\u043D\u043A\u0446\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u043E\u0435
      \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u0435: \u0445\u0430\u0440\u0430\u043A\u0442\u0435\u0440\u0438\u0441\u0442\u0438\u043A\u0430
      \u043A\u0430\u0447\u0435\u0441\u0442\u0432\u0430 iso25010 \u0438\u0437 \u0441\u043F\u0438\u0441\u043A\u0430:
      functional_suitability, performance_efficiency, compatibility, usability, interaction_capability,
