    body: "{\"model\":\"gemini-3.5-flash-lite\",\"stream\":false,\"messages\":[{\"role\":\"user\",\"content\":\"#
      \u0420\u043E\u043B\u044C\\n\\n\u0422\u044B \u2014 \u0441\u0438\u0441\u0442\u0435\u043C\u043D\u044B\u0439
