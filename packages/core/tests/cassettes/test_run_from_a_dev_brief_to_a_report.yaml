      \u0444\u0440\u0430\u0437\u0430\u043C\u0438. UR \u0443\u0442\u043E\u0447\u043D\u044F\u0435\u0442
      BR: refines \u2192 BR.\\n- **FR** \u2014 \u0444\u0443\u043D\u043A\u0446\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u043E\u0435
