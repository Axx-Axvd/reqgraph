      \u0438\u0437 \u0442\u0432\u043E\u0435\u0433\u043E \u043E\u0442\u0432\u0435\u0442\u0430.\\n\\n\u0412\u0441\u0451
      \u0432\u043D\u0443\u0442\u0440\u0438 \u0442\u0435\u0433\u043E\u0432 <requirements>,
