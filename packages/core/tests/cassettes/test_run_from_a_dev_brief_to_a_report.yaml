        \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u044F, NFR \u2013 \u043D\u0435\u0444\u0443\u043D\u043A\u0446\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u0435
