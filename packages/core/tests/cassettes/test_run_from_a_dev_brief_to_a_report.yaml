        \u0437\u0430 24 \u0447\u0430\u0441\u0430 \u0434\u043E \u0437\u0430\u043F\u043B\u0430\u043D\u0438\u0440\u043E\u0432\u0430\u043D\u043D\u043E\u0433\u043E
        \u043F\u0440\u0438\u0451\u043C\u0430.\\\"},{\\\"term\\\":\\\"\u0421\u043B\u043E\u0442\\\",\\\"definition\\\":\\\"\u041E\u0442\u0440\u0435\u0437\u043E\u043A
