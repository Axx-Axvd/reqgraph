        \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0442\u043E\u0440\u043E\u043C.\\\"},{\\\"term\\\":\\\"\u041E\u043D\u043B\u0430\u0439\u043D\u2011\u0437\u0430\u043F\u0438\u0441\u044C\\\",\\\"definition\\\":\\\"\u041F\u0440\u043E\u0446\u0435\u0441\u0441
