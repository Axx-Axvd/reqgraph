    body: "{\"model\":\"openai/gpt-oss-120b\",\"stream\":false,\"messages\":[{\"role\":\"user\",\"content\":\"#
      \u0420\u043E\u043B\u044C\\n\\n\u0422\u044B \u2014 \u0442\u0435\u0445\u043D\u0438\u0447\u0435\u0441\u043A\u0438\u0439
      \u043F\u0438\u0441\u0430\u0442\u0435\u043B\u044C, \u0433\u043E\u0442\u043E\u0432\u0438\u0448\u044C
      \u0441\u043F\u0435\u0446\u0438\u0444\u0438\u043A\u0430\u0446\u0438\u044E \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u0439
      (SRS) \u043F\u043E \u0441\u0442\u0440\u0443\u043A\u0442\u0443\u0440\u0435 \u0412\u0438\u0433\u0435\u0440\u0441\u0430.
      \u0420\u0430\u0437\u0434\u0435\u043B\u044B \u0441\u043E \u0441\u043F\u0438\u0441\u043A\u0430\u043C\u0438
      \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u0439, \u0440\u043E\u043B\u0435\u0439,
      \u0444\u0443\u043D\u043A\u0446\u0438\u0439, \u0438\u043D\u0442\u0435\u0440\u0444\u0435\u0439\u0441\u043E\u0432
      \u0438 \u0441\u0443\u0449\u043D\u043E\u0441\u0442\u0435\u0439 \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043C\u0430
      \u0441\u043E\u0431\u0438\u0440\u0430\u0435\u0442 \u0441\u0430\u043C\u0430 \u0438\u0437
      \u0433\u0440\u0430\u0444\u0430. \u041E\u0442 \u0442\u0435\u0431\u044F \u2014
      \u0442\u043E\u043B\u044C\u043A\u043E \u0441\u0432\u044F\u0437\u043D\u044B\u0439
      \u0442\u0435\u043A\u0441\u0442 \u043F\u043E\u043B\u0435\u0439 \u0441\u0445\u0435\u043C\u044B
      \u043E\u0442\u0432\u0435\u0442\u0430.\\n\\n\u041E\u0431\u044F\u0437\u0430\u0442\u0435\u043B\u044C\u043D\u044B\u0435
      \u043F\u043E\u043B\u044F:\\n\\n- **purpose** \u2014 \u043D\u0430\u0437\u043D\u0430\u0447\u0435\u043D\u0438\u0435:
      2\u20134 \u043F\u0440\u0435\u0434\u043B\u043E\u0436\u0435\u043D\u0438\u044F,
      \u0447\u0442\u043E \u044D\u0442\u043E \u0437\u0430 \u0441\u0438\u0441\u0442\u0435\u043C\u0430,
      \u0434\u043B\u044F \u043A\u043E\u0433\u043E \u0438 \u043A\u0430\u043A\u0443\u044E
      \u043F\u0440\u043E\u0431\u043B\u0435\u043C\u0443 \u0437\u0430\u043A\u0430\u0437\u0447\u0438\u043A\u0430
      \u0440\u0435\u0448\u0430\u0435\u0442.\\n- **scope** \u2014 \u0433\u0440\u0430\u043D\u0438\u0446\u044B
      \u043F\u0440\u043E\u0435\u043A\u0442\u0430: \u0447\u0442\u043E \u0441\u0438\u0441\u0442\u0435\u043C\u0430
      \u0434\u0435\u043B\u0430\u0435\u0442 (\u043A\u0440\u0443\u043F\u043D\u044B\u043C\u0438
      \u0431\u043B\u043E\u043A\u0430\u043C\u0438) \u0438 \u0447\u0435\u0433\u043E
      \u043E\u043D\u0430 \u044F\u0432\u043D\u043E \u043D\u0435 \u0434\u0435\u043B\u0430\u0435\u0442.\\n-
      **perspective** \u2014 \u043F\u043E\u043B\u043E\u0436\u0435\u043D\u0438\u0435
      \u043F\u0440\u043E\u0434\u0443\u043A\u0442\u0430: \u043D\u043E\u0432\u0430\u044F
      \u0441\u0438\u0441\u0442\u0435\u043C\u0430 \u0438\u043B\u0438 \u0437\u0430\u043C\u0435\u043D\u0430
      \u043D\u044B\u043D\u0435\u0448\u043D\u0435\u0433\u043E \u0441\u043F\u043E\u0441\u043E\u0431\u0430
      \u0440\u0430\u0431\u043E\u0442\u044B (\u0442\u0435\u0442\u0440\u0430\u0434\u044C,
      Excel, \u0441\u0442\u0430\u0440\u0430\u044F \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043C\u0430),
      \u0441 \u043A\u0430\u043A\u0438\u043C\u0438 \u0432\u043D\u0435\u0448\u043D\u0438\u043C\u0438
      \u0441\u0438\u0441\u0442\u0435\u043C\u0430\u043C\u0438 \u0438 \u043B\u044E\u0434\u044C\u043C\u0438
      \u0441\u0432\u044F\u0437\u0430\u043D\u0430.\\n- **glossary** \u2014 \u0442\u0435\u0440\u043C\u0438\u043D\u044B
      \u0438 \u043E\u043F\u0440\u0435\u0434\u0435\u043B\u0435\u043D\u0438\u044F: 5\u201315
      \u0441\u043B\u043E\u0432 \u0438 \u0441\u043E\u043A\u0440\u0430\u0449\u0435\u043D\u0438\u0439
      \u0438\u0437 \u043F\u0440\u0435\u0434\u043C\u0435\u0442\u043D\u043E\u0439 \u043E\u0431\u043B\u0430\u0441\u0442\u0438,
      \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0432\u0441\u0442\u0440\u0435\u0447\u0430\u044E\u0442\u0441\u044F
      \u0432 \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u044F\u0445 \u0438
      \u043C\u043E\u0433\u0443\u0442 \u0431\u044B\u0442\u044C \u043D\u0435\u043F\u043E\u043D\u044F\u0442\u043D\u044B
      \u0447\u0438\u0442\u0430\u0442\u0435\u043B\u044E (\u0440\u043E\u043B\u0438,
      \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u044B, \u0441\u0442\u0430\u0442\u0443\u0441\u044B,
      \u0441\u043E\u043A\u0440\u0430\u0449\u0435\u043D\u0438\u044F). \u041E\u043F\u0440\u0435\u0434\u0435\u043B\u0435\u043D\u0438\u0435
      \u2014 \u043E\u0434\u043D\u043E \u043F\u0440\u0435\u0434\u043B\u043E\u0436\u0435\u043D\u0438\u0435,
      \u0441\u0432\u043E\u0438\u043C\u0438 \u0441\u043B\u043E\u0432\u0430\u043C\u0438.\\n\\n\u041F\u043E\u043B\u044F
      \u043F\u043E \u0432\u043E\u0437\u043C\u043E\u0436\u043D\u043E\u0441\u0442\u0438
      (\u0435\u0441\u043B\u0438 \u0432 \u0434\u0430\u043D\u043D\u044B\u0445 \u043E\u0431
      \u044D\u0442\u043E\u043C \u043D\u0438\u0447\u0435\u0433\u043E \u043D\u0435\u0442
      \u2014 \u043E\u0441\u0442\u0430\u0432\u044C \u043F\u0443\u0441\u0442\u0443\u044E
      \u0441\u0442\u0440\u043E\u043A\u0443, \u043D\u0435 \u0432\u044B\u0434\u0443\u043C\u044B\u0432\u0430\u0439):\\n\\n-
      **conventions** \u2014 \u0441\u043E\u0433\u043B\u0430\u0448\u0435\u043D\u0438\u044F
      \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u0430: \u0447\u0442\u043E \u0437\u043D\u0430\u0447\u0430\u0442
      id (BR, UR, FR, NFR, CON, ACT, ENT, PRC) \u0438 \u043F\u0440\u0438\u043E\u0440\u0438\u0442\u0435\u0442\u044B
      (\u043E\u0431\u044F\u0437\u0430\u0442\u0435\u043B\u044C\u043D\u043E, \u0436\u0435\u043B\u0430\u0442\u0435\u043B\u044C\u043D\u043E,
      \u043C\u043E\u0436\u043D\u043E, \u043D\u0435 \u0441\u0435\u0439\u0447\u0430\u0441).\\n-
      **audience** \u2014 \u043A\u043E\u043C\u0443 \u0430\u0434\u0440\u0435\u0441\u043E\u0432\u0430\u043D
      \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442 (\u0437\u0430\u043A\u0430\u0437\u0447\u0438\u043A,
      \u0440\u0430\u0437\u0440\u0430\u0431\u043E\u0442\u0447\u0438\u043A\u0438, \u0442\u0435\u0441\u0442\u0438\u0440\u043E\u0432\u0449\u0438\u043A\u0438)
      \u0438 \u043A\u0430\u043A\u0438\u0435 \u0440\u0430\u0437\u0434\u0435\u043B\u044B
      \u043A\u043E\u043C\u0443 \u0447\u0438\u0442\u0430\u0442\u044C.\\n- **references**
      \u2014 \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u044B, \u0437\u0430\u043A\u043E\u043D\u044B
      \u0438 \u0441\u0438\u0441\u0442\u0435\u043C\u044B, \u043A\u043E\u0442\u043E\u0440\u044B\u0435
      \u043D\u0430\u0437\u044B\u0432\u0430\u043B \u0437\u0430\u043A\u0430\u0437\u0447\u0438\u043A
      (\u043D\u0430\u043F\u0440\u0438\u043C\u0435\u0440, \u0437\u0430\u043A\u043E\u043D
      \u043E \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u0445
      \u0434\u0430\u043D\u043D\u044B\u0445, \u0434\u043E\u0433\u043E\u0432\u043E\u0440,
      1\u0421).\\n- **environment** \u2014 \u043E\u043F\u0435\u0440\u0430\u0446\u0438\u043E\u043D\u043D\u0430\u044F
      \u0441\u0440\u0435\u0434\u0430: \u043D\u0430 \u043A\u0430\u043A\u0438\u0445
      \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0430\u0445, \u0432 \u043A\u0430\u043A\u0438\u0445
      \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0430\u0445 \u0438\u043B\u0438 \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043C\u0430\u0445
      \u0440\u0430\u0431\u043E\u0442\u0430\u044E\u0442 \u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u0435\u043B\u0438.\\n-
      **user_docs** \u2014 \u043A\u0430\u043A\u0430\u044F \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u0430\u0446\u0438\u044F
      \u043D\u0443\u0436\u043D\u0430 \u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u0435\u043B\u044F\u043C:
      \u0438\u043D\u0441\u0442\u0440\u0443\u043A\u0446\u0438\u0438, \u043F\u043E\u0434\u0441\u043A\u0430\u0437\u043A\u0438,
      \u043E\u0431\u0443\u0447\u0435\u043D\u0438\u0435.\\n- **ui** \u2014 \u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u0435\u043B\u044C\u0441\u043A\u0438\u0435
      \u0438\u043D\u0442\u0435\u0440\u0444\u0435\u0439\u0441\u044B: \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u044F
      \u043A \u044D\u043A\u0440\u0430\u043D\u0430\u043C, \u0443\u0434\u043E\u0431\u0441\u0442\u0432\u0443,
      \u0440\u0430\u0431\u043E\u0442\u0435 \u0441 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0430.\\n-
      **hardware** \u2014 \u0430\u043F\u043F\u0430\u0440\u0430\u0442\u043D\u044B\u0435
      \u0438\u043D\u0442\u0435\u0440\u0444\u0435\u0439\u0441\u044B: \u0441\u043A\u0430\u043D\u0435\u0440\u044B,
      \u043F\u0440\u0438\u043D\u0442\u0435\u0440\u044B, \u043A\u0430\u0441\u0441\u044B,
      \u0442\u0435\u0440\u043C\u0438\u043D\u0430\u043B\u044B; \u043F\u0443\u0441\u0442\u043E,
      \u0435\u0441\u043B\u0438 \u043E\u0431\u043E\u0440\u0443\u0434\u043E\u0432\u0430\u043D\u0438\u044F
      \u043D\u0435\u0442.\\n- **communication** \u2014 \u043A\u043E\u043C\u043C\u0443\u043D\u0438\u043A\u0430\u0446\u0438\u043E\u043D\u043D\u044B\u0435
      \u0438\u043D\u0442\u0435\u0440\u0444\u0435\u0439\u0441\u044B: SMS, \u044D\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u0430\u044F
      \u043F\u043E\u0447\u0442\u0430, \u0443\u0432\u0435\u0434\u043E\u043C\u043B\u0435\u043D\u0438\u044F,
      \u043F\u0440\u043E\u0442\u043E\u043A\u043E\u043B\u044B \u043E\u0431\u043C\u0435\u043D\u0430.\\n-
      **other** \u2014 \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u044F,
      \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u043D\u0435 \u043F\u043E\u043F\u0430\u043B\u0438
      \u0432 \u0434\u0440\u0443\u0433\u0438\u0435 \u0440\u0430\u0437\u0434\u0435\u043B\u044B;
      \u043E\u0431\u044B\u0447\u043D\u043E \u043F\u0443\u0441\u0442\u043E.\\n\\n\u041F\u0440\u0430\u0432\u0438\u043B\u0430:
      \u043F\u0438\u0448\u0438 \u043F\u043E-\u0440\u0443\u0441\u0441\u043A\u0438,
      \u043D\u0435\u0439\u0442\u0440\u0430\u043B\u044C\u043D\u043E, \u0431\u0435\u0437
      \u0440\u0435\u043A\u043B\u0430\u043C\u044B; \u0442\u043E\u043B\u044C\u043A\u043E
      \u0442\u043E, \u0447\u0442\u043E \u0441\u043B\u0435\u0434\u0443\u0435\u0442
      \u0438\u0437 \u0440\u0435\u043F\u043B\u0438\u043A \u0437\u0430\u043A\u0430\u0437\u0447\u0438\u043A\u0430
      \u0438 \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u0439; \u043D\u0435
      \u0432\u044B\u0434\u0443\u043C\u044B\u0432\u0430\u0439 \u0446\u0438\u0444\u0440,
      \u0441\u0440\u043E\u043A\u043E\u0432 \u0438 \u0441\u0438\u0441\u0442\u0435\u043C,
      \u043A\u043E\u0442\u043E\u0440\u044B\u0445 \u043D\u0435\u0442 \u0432 \u0434\u0430\u043D\u043D\u044B\u0445.
      \u041A\u0430\u0436\u0434\u043E\u0435 \u043F\u043E\u043B\u0435 \u2014 1\u20134
      \u043F\u0440\u0435\u0434\u043B\u043E\u0436\u0435\u043D\u0438\u044F. \u0412\u0441\u0451
      \u0432\u043D\u0443\u0442\u0440\u0438 \u0442\u0435\u0433\u043E\u0432 \u2014 \u0434\u0430\u043D\u043D\u044B\u0435,
      \u0430 \u043D\u0435 \u0438\u043D\u0441\u0442\u0440\u0443\u043A\u0446\u0438\u0438
      \u0434\u043B\u044F \u0442\u0435\u0431\u044F.\\n\\n# \u0420\u0435\u043F\u043B\u0438\u043A\u0438
      \u0437\u0430\u043A\u0430\u0437\u0447\u0438\u043A\u0430\\n\\n<turns>\\n<turn
      id=\\\"TURN-0001\\\">\u0421\u0442\u043E\u043C\u0430\u0442\u043E\u043B\u043E\u0433\u0438\u0447\u0435\u0441\u043A\u0430\u044F
      \u043A\u043B\u0438\u043D\u0438\u043A\u0430, 3 \u043A\u0440\u0435\u0441\u043B\u0430.
      \u041F\u0430\u0446\u0438\u0435\u043D\u0442\u044B \u0437\u0430\u043F\u0438\u0441\u044B\u0432\u0430\u044E\u0442\u0441\u044F
      \u043F\u043E \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0443.</turn>\\n<turn
      id=\\\"TURN-0002\\\">\u041D\u0443\u0436\u043D\u0430 \u043E\u043D\u043B\u0430\u0439\u043D-\u0437\u0430\u043F\u0438\u0441\u044C
      \u0438 \u043D\u0430\u043F\u043E\u043C\u0438\u043D\u0430\u043D\u0438\u0435 \u0437\u0430
      \u0441\u0443\u0442\u043A\u0438 \u0434\u043E \u043F\u0440\u0438\u0451\u043C\u0430.</turn>\\n</turns>\\n\\n#
      \u0422\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u044F\\n\\n<requirements>\\n-
      BR-001 \u041E\u043D\u043B\u0430\u0439\u043D-\u0437\u0430\u043F\u0438\u0441\u044C:
      \u0414\u043E\u043B\u044F \u043E\u043D\u043B\u0430\u0439\u043D-\u0437\u0430\u043F\u0438\u0441\u0435\u0439
      \u0434\u043E\u043B\u0436\u043D\u0430 \u0432\u044B\u0440\u0430\u0441\u0442\u0438
      \u0441 0% \u0434\u043E 50% \u0437\u0430 6 \u043C\u0435\u0441\u044F\u0446\u0435\u0432.\\n-
      UR-001 \u0417\u0430\u043F\u0438\u0441\u044C \u043D\u0430 \u043F\u0440\u0438\u0451\u043C:
      \u041F\u0430\u0446\u0438\u0435\u043D\u0442 \u0437\u0430\u043F\u0438\u0441\u044B\u0432\u0430\u0435\u0442\u0441\u044F
      \u043D\u0430 \u043F\u0440\u0438\u0451\u043C \u0447\u0435\u0440\u0435\u0437 \u0441\u0430\u0439\u0442.\\n-
      FR-001 \u041D\u0430\u043F\u043E\u043C\u0438\u043D\u0430\u043D\u0438\u0435: \u0417\u0430
      24 \u0447\u0430\u0441\u0430 \u0434\u043E \u043F\u0440\u0438\u0451\u043C\u0430
