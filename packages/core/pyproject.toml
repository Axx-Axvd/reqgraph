[project]
name = "reqgraph"
version = "0.1.0"
description = "Requirements as a checked graph: interview -> requirements -> models as code -> CI -> SRS and GOST 34 TZ"
license = "MIT"
authors = [{ name = "Rybalkin A.A." }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "lxml==6.1.3",
    "networkx==3.7",
    "pm4py==2.7.23.11",
    "pydantic==2.14.1",
    "pydbml==1.2.1",
    "pydantic-ai-slim[openai]==2.60.0",
    "pymorphy3==2.0.6",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.6",
    "typer==0.27.3",
]

[project.scripts]
reqgraph = "reqgraph.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
