# Бизнес-требования (BR): зачем заказчику система. Каждое — с измеримой целью.
- id: BR-001
  title: "Снизить долю неявок"
  statement: "Доля неявок клиентов должна снизиться с 15% до 7% записей в течение 6 месяцев после запуска системы."
  goal_metric: {name: "доля неявок от числа записей", unit: "%", baseline: 15, target: "<= 7", horizon: "6 месяцев после запуска"}
  priority: must
  status: reviewed
  area: goals
  derived_from: [TURN-0004]

- id: BR-002
