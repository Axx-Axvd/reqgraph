# Функциональные требования (FR): что должна делать система. Формулировки по шаблонам EARS:
#   «Система должна ...», «Когда <событие>, система должна ...», «Если <нежелательное>, система должна ...».
# refines -> UR; derived_from -> TURN; realized_by -> элементы моделей (задачи процессов, ENT, UC, C4).
- id: FR-001
  title: "Каталог услуг"
  statement: "Система должна показывать клиенту список услуг с длительностью и базовой ценой каждой услуги."
  priority: must
  status: reviewed
  area: scenarios
  acceptance:
    - "в списке есть все услуги из прайса сервиса"
    - "для каждой услуги указаны длительность в минутах и цена в рублях"
  refines: [UR-001]
  derived_from: [TURN-0008]
  realized_by: [PRC-01.T02, ENT-02, C4-CNT-01]

- id: FR-002
  title: "Свободные слоты"
  statement: "Когда клиент выбрал услугу, система должна показать свободные слоты на 14 дней вперёд с учётом длительности услуги и смен мастеров."
  priority: must
  status: reviewed
  area: scenarios
  acceptance:
    - "показываются только слоты, в которые у мастера с нужной специализацией есть смена и нет записи"
    - "слот не показывается, если до конца смены меньше длительности услуги"
    - "горизонт показа — 14 календарных дней от текущей даты"
  refines: [UR-001]
  derived_from: [TURN-0010]
  realized_by: [PRC-01.T03, ENT-04, ENT-08]

- id: FR-003
  title: "Создание записи"
  statement: "Когда клиент подтвердил свободный слот, система должна создать запись со статусом «подтверждена» на мастера этого слота."
  priority: must
  status: reviewed
  area: scenarios
  acceptance:
    - "запись содержит клиента, автомобиль, услугу, мастера, дату и время начала"
    - "закреплённый слот не показывается другим клиентам"
  refines: [UR-001]
  derived_from: [TURN-0008]
  realized_by: [PRC-01.T04, ENT-05, UC-01, C4-CNT-02, C4-CNT-03]

- id: FR-004
  title: "Подтверждение телефона"
  statement: "Система должна идентифицировать частного клиента по номеру телефона с подтверждением одноразовым кодом из SMS."
  priority: must
  status: reviewed
  area: scenarios
  acceptance:
    - "запись невозможна без введённого верного кода"
    - "повторный вход с того же номера находит существующего клиента"
  refines: [UR-001]
  derived_from: [TURN-0010]
  realized_by: [PRC-01.T01, ENT-01, C4-EXT-01]

- id: FR-005
  title: "SMS-подтверждение записи"
  statement: "Когда запись создана, система должна отправить клиенту SMS с датой, временем и адресом сервиса."
  priority: must
  status: reviewed
  area: scenarios
  acceptance:
    - "SMS отправляется не позднее чем через 1 минуту после создания записи"
  refines: [UR-001]
  derived_from: [TURN-0008]
  realized_by: [PRC-01.T05, C4-CNT-04]

- id: FR-006
  title: "Расписание мастеров"
  statement: "Система должна показывать администратору расписание всех мастеров на выбранный день с записями и свободными слотами."
  priority: must
  status: reviewed
  area: scenarios
  acceptance:
    - "для каждого мастера видны смена, записи с клиентом и услугой, свободные интервалы"
  refines: [UR-004]
  derived_from: [TURN-0006]
  realized_by: [UC-04]

- id: FR-007
  title: "Напоминание о визите"
  statement: "За 24 часа до начала записи система должна отправить клиенту SMS-напоминание с датой, временем и адресом."
  priority: must
  status: reviewed
  area: scenarios
  acceptance:
    - "SMS уходит в интервале 24 ч ± 15 мин до начала записи"
    - "для отменённой записи напоминание не отправляется"
  refines: [UR-002]
  derived_from: [TURN-0014]
  realized_by: [PRC-02.T01, C4-CNT-04]

- id: FR-008
  title: "Отмена записи клиентом"
  statement: "Когда клиент отменил запись не позднее чем за 2 часа до её начала, система должна перевести запись в статус «отменена»."
  priority: must
  status: reviewed
  area: rules
  acceptance:
    - "слот отменённой записи снова показывается как свободный"
    - "отмена позже чем за 2 часа до начала отклоняется с сообщением о сроке"
  refines: [UR-002]
  derived_from: [TURN-0014]
  realized_by: [PRC-02.T02, UC-02]

- id: FR-009
  title: "Отметка неявки"
  statement: "Если клиент не приехал в течение 15 минут после начала записи, система должна позволить администратору перевести запись в статус «неявка»."
  priority: must
  status: reviewed
  area: exceptions
  acceptance:
    - "кнопка отметки неявки доступна только через 15 минут после начала записи"
    - "запись со статусом «неявка» учитывается в доле неявок (BR-001)"
  refines: [UR-004]
  derived_from: [TURN-0016]
  realized_by: [UC-05]

- id: FR-010
  title: "Корпоративная запись"
  statement: "Система должна позволять менеджеру корпоративного клиента записывать автомобили автопарка по действующему договору без SMS-кода для каждой записи."
  priority: should
  status: reviewed
  area: rules
  acceptance:
    - "записать можно только автомобиль, привязанный к действующему договору"
    - "при истёкшем договоре запись отклоняется с сообщением о сроке договора"
  refines: [UR-003]
  derived_from: [TURN-0020]
  realized_by: [UC-03, ENT-06, ENT-03]

- id: FR-011
  title: "Ежемесячный счёт"
  statement: "В первый рабочий день месяца система должна сформировать по каждому действующему договору счёт за работы прошлого месяца со сроком оплаты из договора."
  priority: should
  status: reviewed
  area: rules
  acceptance:
    - "в счёт попадают только записи прошлого месяца со статусом «выполнена»"
    - "срок оплаты = дата счёта + отсрочка из договора в днях"
  refines: [UR-003]
  derived_from: [TURN-0020]
  realized_by: [UC-06, ENT-07]

- id: FR-012
  title: "Выгрузка счетов для бухгалтерии"
  statement: "Система должна выгружать счета за выбранный месяц в файл Excel (xlsx) для загрузки бухгалтером в 1С."
  priority: could
  status: reviewed
  area: integrations
  acceptance:
    - "файл содержит номер счёта, компанию, ИНН, сумму, дату и срок оплаты"
  refines: [UR-003]
  derived_from: [TURN-0022]
  realized_by: [UC-08]

- id: FR-013
  title: "Слот занят другим клиентом"
  statement: "Если выбранный слот занял другой клиент до подтверждения записи, система должна предложить клиенту три ближайших свободных слота той же услуги."
  priority: must
  status: reviewed
  area: exceptions
  acceptance:
    - "клиент видит сообщение «Это время уже занято»"
    - "предложенные слоты свободны на момент показа"
  refines: [UR-001]
  derived_from: [TURN-0012]
  realized_by: [PRC-01.T06]

- id: FR-014
  title: "Перенос записей мастера"
  statement: "Если мастер не вышел на смену, система должна позволить администратору перенести его записи на другого мастера той же специализации."
  priority: should
  status: reviewed
  area: exceptions
  acceptance:
    - "в списке для переноса только мастера той же специализации со свободной сменой в это время"
    - "клиенту каждой перенесённой записи уходит SMS о смене мастера"
  refines: [UR-004]
  derived_from: [TURN-0018]
  realized_by: [UC-07]
