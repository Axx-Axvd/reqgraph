# Пользовательские требования (UR): что пользователь делает с системой. refines -> BR.
- id: UR-001
  actor: ACT-01
  title: "Онлайн-запись частного клиента"
  statement: "Частный клиент записывается на обслуживание через сайт без звонка администратору."
  scenario:
    - "подтверждает номер телефона кодом из SMS"
    - "выбирает услугу из прайса"
    - "выбирает свободное время на ближайшие 14 дней"
    - "получает SMS с подтверждением записи"
  priority: must
  status: reviewed
  area: scenarios
  refines: [BR-002]
  derived_from: [TURN-0008]

- id: UR-002
  actor: ACT-01
  title: "Напоминание и отмена"
  statement: "Частный клиент получает напоминание о визите и может отменить запись не позднее чем за 2 часа до визита."
  scenario:
    - "получает SMS-напоминание за 24 часа до визита"
    - "отвечает на SMS словом «отмена» или отменяет запись на сайте"
  priority: must
  status: reviewed
  area: scenarios
  refines: [BR-001]
  derived_from: [TURN-0014]

- id: UR-003
  actor: ACT-02
  title: "Корпоративные записи по договору"
  statement: "Менеджер автопарка записывает автомобили компании по договору и раз в месяц получает счёт с отсрочкой оплаты."
  scenario:
    - "входит в личный кабинет компании"
    - "записывает несколько автомобилей без SMS-кода для каждой записи"
    - "получает счёт за прошлый месяц"
  priority: should
  status: reviewed
  area: scenarios
  refines: [BR-003]
  derived_from: [TURN-0020]

- id: UR-004
  actor: ACT-03
  title: "Управление расписанием"
  statement: "Администратор видит расписание мастеров, отмечает неявки и переносит записи заболевшего мастера."
  scenario:
    - "открывает расписание на выбранный день"
    - "отмечает неявку, если клиент не приехал за 15 минут"
    - "переносит записи мастера, который не вышел на смену"
  priority: must
  status: reviewed
  area: scenarios
  refines: [BR-001, BR-002]
  derived_from: [TURN-0006, TURN-0016]
