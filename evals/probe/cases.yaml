# Probe (T-006): 20 tasks, 4 blocks x 5, to compare models per role (06_models, «Мини-бенчмарк»).
# Domains deliberately differ from the 15 thesis scenarios (T-303); these tasks are dev data only.
# Block -> role: extract -> analyst, process -> modeler, rewrite -> standards, question -> interviewer.

extract:
  - name: extract-fitness
    domain: фитнес-клуб
    transcript: |
      Аналитик: Как сейчас клиенты записываются на групповые занятия?
      Заказчик: Звонят администратору, он пишет в тетрадку. Хотим, чтобы клиент сам записывался в приложении и видел, сколько мест осталось.
      Аналитик: А если мест нет?
      Заказчик: Тогда пусть встаёт в лист ожидания, и если кто-то отменит — ему придёт уведомление.
      Аналитик: Сколько клиентов одновременно может пользоваться приложением?
      Заказчик: В понедельник утром бывает человек двести сразу, приложение не должно тормозить.
    expected:
      - {kind: FR, text: клиент записывается на групповое занятие в приложении}
      - {kind: FR, text: приложение показывает количество свободных мест}
      - {kind: FR, text: при отсутствии мест клиент встаёт в лист ожидания}
      - {kind: FR, text: при отмене записи клиент из листа ожидания получает уведомление}
      - {kind: NFR, text: приложение выдерживает 200 одновременных пользователей}

  - name: extract-coworking
    domain: коворкинг
    transcript: |
      Аналитик: Что нужно резидентам в первую очередь?
      Заказчик: Бронировать переговорки на час или два. Чтобы двое не забронировали одну и ту же на одно время.
      Аналитик: Как они платят?
      Заказчик: Картой онлайн, а раз в месяц мы выставляем компаниям общий счёт.
      Аналитик: Есть ли требования к данным?
      Заказчик: Паспортные данные резидентов храним, так что всё должно быть по 152-ФЗ.
    expected:
      - {kind: FR, text: резидент бронирует переговорную комнату на время}
      - {kind: FR, text: система не допускает двойного бронирования одной комнаты на одно время}
      - {kind: FR, text: резидент оплачивает бронирование картой онлайн}
      - {kind: FR, text: система ежемесячно выставляет компаниям общий счёт}
      - {kind: NFR, text: персональные данные резидентов обрабатываются по 152-ФЗ}

  - name: extract-bikes
    domain: прокат велосипедов
    transcript: |
      Аналитик: Расскажите, как проходит аренда.
      Заказчик: Человек сканирует QR-код на велосипеде, замок открывается, время пошло. Вернул на любую нашу станцию — аренда закрылась, деньги списались.
      Аналитик: А если вернул не на станцию?
      Заказчик: Штраф 500 рублей. И ещё: замок должен открываться не дольше чем за пять секунд, иначе люди уходят.
    expected:
      - {kind: FR, text: пользователь начинает аренду, сканируя QR-код велосипеда}
      - {kind: FR, text: аренда завершается при возврате велосипеда на любую станцию}
      - {kind: FR, text: стоимость аренды списывается при завершении}
      - {kind: FR, text: при возврате вне станции начисляется штраф 500 рублей}
      - {kind: NFR, text: замок открывается не дольше чем за 5 секунд}

  - name: extract-dance
    domain: школа танцев
    transcript: |
      Аналитик: Что не устраивает в текущем учёте?
      Заказчик: Абонементы считаем в Excel, путаемся. Нужно, чтобы при отметке на занятии с абонемента списывалось одно занятие автоматически.
      Аналитик: Что ещё?
      Заказчик: Преподаватель должен видеть список группы на телефоне. И родители детей хотят получать отчёт о посещаемости раз в месяц.
      Аналитик: Сколько у вас филиалов?
      Заказчик: Три, и данные должны быть общие, в одной базе.
    expected:
      - {kind: FR, text: при отметке посещения с абонемента автоматически списывается одно занятие}
      - {kind: FR, text: преподаватель видит список группы на мобильном устройстве}
      - {kind: FR, text: родители ежемесячно получают отчёт о посещаемости}
      - {kind: CON, text: три филиала работают в одной общей базе данных}

  - name: extract-housing
    domain: управляющая компания ЖКХ
    transcript: |
      Аналитик: С какими обращениями чаще всего приходят жители?
      Заказчик: Протечки, лифты, мусор. Хотим, чтобы житель мог подать заявку с фотографией, а диспетчер назначал её мастеру.
      Аналитик: Житель видит, что с заявкой?
      Заказчик: Да, статус меняется, и если заявка висит больше двух суток — она должна автоматически уходить главному инженеру.
      Аналитик: Важна ли доступность?
      Заказчик: Аварийные заявки принимаем круглосуточно, система должна работать 24/7.
    expected:
      - {kind: FR, text: житель подаёт заявку с фотографией}
      - {kind: FR, text: диспетчер назначает заявку мастеру}
      - {kind: FR, text: житель видит статус своей заявки}
      - {kind: FR, text: заявка без решения дольше двух суток эскалируется главному инженеру}
      - {kind: NFR, text: система доступна круглосуточно}

process:
  - name: process-fitness-freeze
    domain: фитнес-клуб
    description: |
      Клиент подаёт заявку на заморозку абонемента. Менеджер проверяет, не использована ли заморозка в этом году.
      Если использована — заявка отклоняется и клиенту отправляется отказ. Если нет — менеджер устанавливает даты
      заморозки, система продлевает абонемент на число дней заморозки и отправляет клиенту подтверждение.
    expected:
      tasks: [заявк, провер, отказ, дат, продл, подтвержд]
      min_gateways: 1

  - name: process-coworking-pass
    domain: коворкинг
    description: |
      Гость приходит на ресепшен. Администратор ищет гостя в списке приглашённых. Если гостя нет в списке,
      администратор звонит резиденту; резидент либо подтверждает гостя, либо отказывает — тогда гость уходит.
      Если гость есть в списке или подтверждён, администратор выдаёт гостевой пропуск и регистрирует время входа.
    expected:
      tasks: [ищет, звон, подтвер, пропуск, регистр]
      min_gateways: 2

  - name: process-bike-repair
    domain: прокат велосипедов
    description: |
      Пользователь сообщает о поломке велосипеда в приложении. Система блокирует велосипед для аренды и создаёт
      задание механику. Механик осматривает велосипед. Если ремонт возможен на месте — чинит и разблокирует велосипед.
      Если нет — отвозит в мастерскую, где велосипед ремонтируют и затем возвращают на станцию и разблокируют.
    expected:
      tasks: [сообщ, блок, задани, осматр, чин, мастерск, разблок]
      min_gateways: 1

  - name: process-print-order
    domain: типография
    description: |
      Клиент загружает макет и оформляет заказ. Препресс-инженер проверяет макет. Если в макете ошибки, клиенту
      отправляются замечания, он исправляет и загружает макет снова, после чего проверка повторяется. Когда макет
      принят, клиент оплачивает заказ, заказ печатается и передаётся в доставку.
    expected:
      tasks: [загруж, провер, замечан, исправ, оплач, печат, доставк]
      min_gateways: 1

  - name: process-shelter-adoption
    domain: приют для животных
    description: |
      Кандидат заполняет анкету на усыновление животного. Волонтёр проводит собеседование. Если кандидат не подходит,
      ему отправляется вежливый отказ. Если подходит, назначается знакомство с животным; после знакомства кандидат
      решает, берёт ли он животное. При согласии подписывается договор и животное передаётся новому хозяину.
    expected:
      tasks: [анкет, собеседован, отказ, знакомств, договор, переда]
      min_gateways: 2

rewrite:
  - name: rewrite-fast-search
    domain: музей
    bad: Поиск экспонатов должен работать быстро и удобно.
    keep: [поиск, экспонат]

  - name: rewrite-secure-tickets
    domain: музей
    bad: Система должна надёжно защищать данные покупателей билетов и т. д.
    keep: [данн, билет]

  - name: rewrite-flexible-tours
    domain: турагентство
    bad: Желательно, чтобы менеджер мог гибко менять туры при необходимости.
    keep: [менеджер, тур]

  - name: rewrite-many-users
    domain: турагентство
    bad: Сайт должен выдерживать большое количество пользователей без проблем.
    keep: [сайт, пользовател]

  - name: rewrite-modern-ui
    domain: типография
    bad: Интерфейс личного кабинета должен быть современным и интуитивно понятным.
    keep: [личн, кабинет]

question:
  - name: question-museum-roles
    domain: музей
    covered: [покупка билетов онлайн, расписание выставок]
    gap: роли и права сотрудников
    area: [рол, прав, сотрудник, доступ]
    hidden: [смотритель, экскурсовод, бухгалтер]

  - name: question-tour-payments
    domain: турагентство
    covered: [подбор тура, бронирование отеля]
    gap: оплата и возвраты
    area: [оплат, возврат, плат]
    hidden: [рассрочк, возврат 30, предоплат]

  - name: question-print-volumes
    domain: типография
    covered: [загрузка макетов, проверка макетов]
    gap: нагрузка и объёмы заказов
    area: [нагрузк, объём, объем, количеств, сколько заказ]
    hidden: [500 заказов, пиковый сезон, выпускной]

  - name: question-shelter-reports
    domain: приют для животных
    covered: [анкета кандидата, знакомство с животным]
    gap: отчётность после передачи животного
    area: [отчёт, отчет, после передач, наблюден]
    hidden: [фото раз в месяц, три месяца]

  - name: question-housing-integrations
    domain: управляющая компания ЖКХ
    covered: [подача заявок, назначение мастеров]
    gap: интеграции с внешними системами
    area: [интеграц, внешн, обмен данн, систем]
    hidden: [ГИС ЖКХ, 1С, аварийная служба города]
