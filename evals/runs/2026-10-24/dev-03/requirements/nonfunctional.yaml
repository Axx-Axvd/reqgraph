# Нефункциональные требования (NFR): характеристика ISO/IEC 25010 + метрика + единица + порог + метод проверки.
- id: NFR-001
  title: "Доступность для слабовидящих"
  statement: "Интерфейс сайта должен полностью соответствовать стандартам доступности для слабовидящих людей."
  iso25010: usability
  metric: {name: "поддержка требований для слабовидящих", unit: "%", threshold: "== 100", method: "проверка интерфейса на соответствие требованиям WCAG"}
  priority: must
  refines: [UR-001, UR-002]
  derived_from: [TURN-0004]

- id: NFR-002
  title: "Производительность в пиковые периоды"
  statement: "В начале семестра система должна корректно обслуживать не менее 500 одновременных пользователей."
  iso25010: performance_efficiency
  metric: {name: "количество одновременных пользователей", unit: "пользователей", threshold: ">= 500", method: "тестирование одновременных подключений в начале семестра"}
  priority: must
  refines: [UR-001, UR-002]
  derived_from: [TURN-0004]
