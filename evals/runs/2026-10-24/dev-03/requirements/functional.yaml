# Функциональные требования (FR): что должна делать система. Формулировки по шаблонам EARS:
#   «Система должна ...», «Когда <событие>, система должна ...», «Если <нежелательное>, система должна ...».
# refines -> UR; derived_from -> TURN; realized_by -> элементы моделей (задачи процессов, ENT, UC, C4).
- id: FR-001
  title: "Поиск по электронному каталогу"
  statement: "Система должна предоставлять электронный каталог с поиском по названию, автору и теме и отображением количества свободных экземпляров."
  priority: must
  acceptance:
    - "в каталоге есть поля ввода для поиска по названию, автору и теме"
    - "для каждого издания отображается количество свободных экземпляров"
  refines: [UR-001, UR-002]
  derived_from: [TURN-0002]
  realized_by: [ENT-02, PRC-01.T01, PRC-01.T02, PRC-02.T01, PRC-02.T02]

- id: FR-002
  title: "Автоматическое снятие бронирования"
  statement: "Когда читатель бронирует книгу онлайн, система должна предоставить 2 рабочих дня на ее получение, после чего автоматически снимать бронь."
  priority: must
  acceptance:
    - "после подтверждения бронирования система фиксирует срок в 2 рабочих дня для получения книги"
    - "если книга не забрана за 2 рабочих дня, система снимает бронь"
  refines: [UR-001, UR-002]
  derived_from: [TURN-0002]
  realized_by: [ENT-03, PRC-01.T03, PRC-02.T03]

- id: FR-003
  title: "Установление сроков выдачи книг"
  statement: "Система должна устанавливать срок выдачи книги в 30 дней для студентов и 90 дней для преподавателей."
  priority: must
  acceptance:
    - "для роли студента срок выдачи книги устанавливается равным 30 дням"
    - "для роли преподавателя срок выдачи книги устанавливается равным 90 дням"
  refines: [UR-001, UR-002]
  derived_from: [TURN-0002]
  realized_by: [ENT-03]

- id: FR-004
  title: "Продление срока выдачи книг"
  statement: "Когда читатель запрашивает продление через личный кабинет, система должна разрешать его один раз при отсутствии очереди на книгу."
  priority: must
  acceptance:
    - "система разрешает продление срока выдачи ровно один раз через личный кабинет"
    - "система блокирует продление, если на книгу есть очередь из других читателей"
  refines: [UR-001, UR-002]
  derived_from: [TURN-0002]
  realized_by: [ENT-03]

- id: FR-005
  title: "Начисление пени и блокировка должников"
  statement: "Если книга не возвращена в срок, система должна начислять пени 10 рублей в день и блокировать выдачу новых книг должнику."
  priority: must
  acceptance:
    - "при просрочке возврата система начисляет пени в размере 10 рублей в день"
    - "система блокирует выдачу новых книг читателям с начисленными пени"
  refines: [UR-001, UR-002]
  derived_from: [TURN-0002]
  realized_by: [ENT-03]

- id: FR-006
  title: "Авторизация читателя по пропуску"
  statement: "Когда читатель предъявляет номер студенческого билета или пропуска сотрудника, система должна осуществлять вход в систему."
  priority: must
  acceptance:
    - "читатель вводит номер студенческого билета или пропуска сотрудника для входа"
    - "система проверяет наличие читателя в актуальной базе данных"
  refines: [UR-003]
  derived_from: [TURN-0003]
  realized_by: [ENT-01, PRC-03.T01, PRC-03.T02]

- id: FR-007
  title: "Выдача и прием книг по штрихкоду"
  statement: "Когда библиотекарь считывает штрихкод книги, система должна регистрировать выдачу или прием экземпляра."
  priority: must
  acceptance:
    - "библиотекарь сканирует штрихкод книги и штрихкод читательского билета для выдачи или приема"
    - "система фиксирует операцию выдачи или возврата книги"
  refines: [UR-003]
  derived_from: [TURN-0003]
  realized_by: [ENT-02, ENT-03]

- id: FR-008
  title: "Формирование квартального отчета о книговыдаче"
  statement: "Когда заведующая запрашивает отчет, система должна формировать квартальный отчет о книговыдаче для ректората."
  priority: must
  acceptance:
    - "заведующая выбирает квартальный период для отчета"
    - "система формирует отчет о книговыдаче для ректората"
  refines: [UR-004]
  derived_from: [TURN-0003]
  realized_by: [ENT-05, PRC-04.T01, PRC-04.T02]

- id: FR-009
  title: "Ночная синхронизация с 1С:Университет"
  statement: "Каждую ночь система должна синхронизировать список студентов и сотрудников с 1С:Университет."
  priority: must
  acceptance:
    - "система производит сверку списка студентов и сотрудников каждую ночь в автоматическом режиме"
    - "источником данных является 1С:Университет"
  refines: [UR-003]
  derived_from: [TURN-0003]
  realized_by: [ENT-01]

- id: FR-010
  title: "Доступ к электронным подпискам из личного кабинета"
  statement: "Система должна предоставлять доступ к электронным подпискам на журналы из личного кабинета читателя."
  priority: must
  acceptance:
    - "в личном кабинете читателя отображается раздел с электронными подписками на журналы"
    - "при клике на подписку система открывает доступ к материалам журнала"
  refines: [UR-001, UR-002]
  derived_from: [TURN-0003]
  realized_by: [ENT-04]
