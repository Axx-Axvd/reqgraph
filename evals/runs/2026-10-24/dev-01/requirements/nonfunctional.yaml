# Нефункциональные требования (NFR): характеристика ISO/IEC 25010 + метрика + единица + порог + метод проверки.
- id: NFR-001
  title: "Время отклика формы записи"
  statement: "Время загрузки страницы расписания и формы записи на сайте не должно превышать 2 секунд."
  iso25010: performance_efficiency
  metric: {name: "Время отклика страницы записи на сайте", unit: "секунд", threshold: "<= 2", method: "Измерение времени отклика системы под нагрузкой"}
  priority: must
  area: nfr
  assumption: true
  refines: [UR-001]

- id: NFR-002
  title: "Доступность веб-сайта"
  statement: "Доступность веб-сайта для самостоятельной записи пациентов должна составлять не менее 99.9% за календарный месяц."
  iso25010: reliability
  metric: {name: "Доступность веб-сайта клиники", unit: "%", threshold: ">= 99.9", method: "Расчет доли успешных запросов к серверу за календарный месяц"}
  priority: must
  area: nfr
  assumption: true
  refines: [UR-001]
