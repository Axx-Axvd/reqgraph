# Функциональные требования (FR): что должна делать система. Формулировки по шаблонам EARS:
#   «Система должна ...», «Когда <событие>, система должна ...», «Если <нежелательное>, система должна ...».
# refines -> UR; derived_from -> TURN; realized_by -> элементы моделей (задачи процессов, ENT, UC, C4).
- id: FR-001
  title: "Создание записи пациентом на сайте"
  statement: "Система должна позволять пациенту выбрать врача и свободное время на сайте для создания записи."
  priority: must
  area: scenarios
  acceptance:
    - "Пациент может выбрать врача из списка (терапевт, хирург, ортодонт)"
    - "Пациент может выбрать доступный слот времени из сетки расписания"
    - "Система сохраняет созданную запись в базе данных"
  refines: [UR-001]
  derived_from: [TURN-0002]
  realized_by: [ENT-01, ENT-02, ENT-03, ENT-04, PRC-01.T01, PRC-01.T02]

- id: FR-002
  title: "Напоминание о приёме"
  statement: "За 24 часа до приёма система должна отправить пациенту напоминание со ссылкой на отмену записи."
  priority: must
  area: scenarios
  acceptance:
    - "Система отправляет напоминание за 24 часа до назначенного времени приёма"
    - "В напоминании содержится дата, время и ссылка на отмену записи"
  refines: [UR-001]
  derived_from: [TURN-0002]
  realized_by: [PRC-01.T03]

- id: FR-003
  title: "Отмена записи по ссылке"
  statement: "Когда пациент переходит по ссылке отмены из напоминания, система должна отменять его запись."
  priority: must
  area: scenarios
  acceptance:
    - "Пациент нажимает ссылку отмены и подтверждает действие"
    - "Статус записи изменяется на \"отменено\" в базе данных"
    - "Выбранный слот времени становится доступным для новой записи"
  refines: [UR-002]
  derived_from: [TURN-0002]
  realized_by: [ENT-04, PRC-02.T01, PRC-02.T02]

- id: FR-004
  title: "Просмотр расписания врачей регистратором"
  statement: "Система должна отображать регистратору актуальное расписание всех врачей клиники."
  priority: must
  area: scenarios
  acceptance:
    - "Регистратор видит единое расписание всех 4 врачей (2 терапевта, хирург, ортодонт) в интерфейсе"
    - "Интерфейс отображает занятые и свободные слоты времени"
  refines: [UR-003]
  derived_from: [TURN-0001, TURN-0002]
  realized_by: [ENT-02, ENT-03, PRC-03.T01]

- id: FR-005
  title: "Перенос записи регистратором"
  statement: "Когда врач заболел, система должна позволять регистратору переносить запись пациента на другое время или к другому врачу."
  priority: must
  area: scenarios
  acceptance:
    - "Регистратор выбирает существующую запись и указывает новое время или другого врача"
    - "Система сохраняет изменения в расписании"
    - "Система отправляет пациенту уведомление об изменении времени записи"
  refines: [UR-003]
  derived_from: [TURN-0002]
  realized_by: [ENT-02, ENT-04, PRC-03.T02, PRC-03.T03]
