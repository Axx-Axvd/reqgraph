# Функциональные требования (FR): что должна делать система. Формулировки по шаблонам EARS:
#   «Система должна ...», «Когда <событие>, система должна ...», «Если <нежелательное>, система должна ...».
# refines -> UR; derived_from -> TURN; realized_by -> элементы моделей (задачи процессов, ENT, UC, C4).
- id: FR-001
  title: "Каталог товаров с ценами и фото"
  statement: "Когда клиент открывает сайт, система должна отображать каталог товаров с ценами и фотографиями."
  area: integrations
  acceptance:
    - "проверить, что при открытии сайта отображается каталог товаров с ценами и фотографиями, сравнив список товаров с ожидаемым набором"
  refines: [UR-001]
  derived_from: [TURN-0002]
  realized_by: [ENT-01, PRC-01.T01]

- id: FR-002
  title: "Управление корзиной"
  statement: "Когда клиент добавляет товары, система должна рассчитывать и отображать содержимое корзины."
  area: rules
  acceptance:
    - "проверить, что при добавлении товаров в корзину система корректно рассчитывает и отображает её содержимое"
  refines: [UR-001]
  derived_from: [TURN-0002]
  realized_by: [ENT-02, PRC-01.T02]

- id: FR-003
  title: "Выбор интервала времени доставки"
  statement: "Когда клиент оформляет заказ, система должна позволять выбрать время доставки интервалами по 1 часу."
  area: rules
  acceptance:
    - "проверить, что при оформлении заказа клиент может выбрать любой часовой интервал доставки, и выбранный интервал сохраняется в заказе"
  refines: [UR-002]
  derived_from: [TURN-0002]
  realized_by: [ENT-03, PRC-02.T01]

- id: FR-004
  title: "Оплата заказа"
  statement: "Когда клиент оформляет заказ, система должна предоставлять возможность оплаты картой онлайн или наличными курьеру."
  area: rules
  acceptance:
    - "проверить, что при оформлении заказа доступны два способа оплаты – онлайн-картой и наличными курьеру, и каждый способ успешно завершает оплату"
  refines: [UR-002]
  derived_from: [TURN-0002]
  realized_by: [ENT-03, PRC-02.T02, PRC-02.T05]

- id: FR-005
  title: "Минимальная сумма заказа"
  statement: "Если сумма заказа меньше 700 рублей, система должна блокировать оформление заказа."
  area: rules
  acceptance:
    - "проверить, что при сумме заказа менее 700 рублей система блокирует оформление и выводит соответствующее сообщение"
  refines: [UR-002]
  derived_from: [TURN-0002]
  realized_by: [ENT-03, PRC-02.G01]

- id: FR-006
  title: "Расчет стоимости доставки"
  statement: "Если сумма заказа составляет от 700 до 1999 рублей, система должна добавлять стоимость доставки 250 рублей, а при заказе от 2000 рублей доставка должна быть бесплатной."
  area: rules
  acceptance:
    - "проверить, что при сумме 700-1999 рублей к заказу добавляется доставка 250 руб., а при сумме >=2000 руб. доставка бесплатна"
  refines: [UR-002]
  derived_from: [TURN-0002]
  realized_by: [ENT-03, PRC-02.T03]

- id: FR-007
  title: "Список заказов курьера"
  statement: "Система должна предоставлять курьеру список его заказов на день с адресами и возможностью проставить отметку «доставлено»."
  area: rules
  acceptance:
    - "проверить, что курьер видит список своих заказов на день с адресами и может отметить каждый заказ как «доставлено», после чего статус сохраняется"
  refines: [UR-003]
  derived_from: [TURN-0003]
  realized_by: [ENT-03, ENT-06, PRC-03.T01, PRC-03.T02]

- id: FR-008
  title: "Панель управления менеджера"
  statement: "Система должна предоставлять менеджеру интерфейс для просмотра всех заказов и их статусов."
  area: rules
  acceptance:
    - "проверить, что менеджер видит интерфейс со всеми заказами и их текущими статусами, и статус каждого заказа отображается корректно"
  refines: [UR-004]
  derived_from: [TURN-0003]
  realized_by: [ENT-03, PRC-04.T01]

- id: FR-009
  title: "Повтор прошлого заказа одной кнопкой"
  statement: "Когда корпоративный клиент заходит в систему, система должна позволять повторить прошлый заказ одной кнопкой."
  area: rules
  acceptance:
    - "проверить, что корпоративный клиент может одним нажатием повторить последний заказ и система формирует новый заказ с теми же позициями"
  refines: [UR-005]
  derived_from: [TURN-0003]
  realized_by: [ENT-03, ENT-04, ENT-05, PRC-05.T02, PRC-05.T04]

- id: FR-010
  title: "Оплата по счёту раз в месяц"
  statement: "Система должна предоставлять корпоративным клиентам возможность оплаты по счёту 1 раз в месяц."
  area: rules
  acceptance:
    - "проверить, что корпоративный клиент может выбрать оплату по счёту раз в месяц, и система генерирует единственный счёт за все заказы в выбранный период"
  refines: [UR-005]
  derived_from: [TURN-0003]
  realized_by: [ENT-03, ENT-05, PRC-05.T05]
