# Эталон test-02 (размер M): что знает заказчик. Черновик Claude (T-303), проверяет автор.
requirements:
  - {id: H-001, kind: BR, area: goals, priority: must, statement: "Доля показаний счётчиков, переданных онлайн, должна вырасти до 80% за год.", reveal: "цели проекта, показания"}
  - {id: H-002, kind: BR, area: goals, priority: should, statement: "Среднее время выполнения обычной заявки должно сократиться с 5 до 2 рабочих дней.", reveal: "цели проекта, скорость ремонта"}
  - {id: H-003, kind: BR, area: goals, priority: should, statement: "Число звонков в диспетчерскую должно снизиться на 40% за полгода.", reveal: "цели проекта, нагрузка на диспетчеров"}
  - {id: H-004, kind: UR, area: stakeholders, priority: must, in_brief: true, statement: "Жилец в личном кабинете передаёт показания, оставляет заявки и читает объявления.", reveal: "что делает жилец"}
  - {id: H-005, kind: UR, area: stakeholders, priority: must, statement: "Диспетчер распределяет заявки между мастерами и подрядчиками.", reveal: "работа диспетчера"}
  - {id: H-006, kind: UR, area: stakeholders, priority: should, statement: "Подрядчик видит только заявки по своему виду работ.", reveal: "подрядчики"}
  - {id: H-007, kind: UR, area: stakeholders, priority: should, in_brief: true, statement: "Управляющий домом публикует объявления для своих домов.", reveal: "кто пишет объявления"}
  - {id: H-008, kind: FR, area: scenarios, priority: must, in_brief: true, statement: "Жилец передаёт показания счётчиков воды и электричества.", reveal: "передача показаний"}
  - {id: H-009, kind: FR, area: scenarios, priority: must, statement: "Жилец регистрируется в кабинете по номеру лицевого счёта и коду из квитанции.", reveal: "регистрация жильца"}
  - {id: H-010, kind: FR, area: scenarios, priority: must, statement: "Жилец оставляет заявку с фото и выбирает удобное окно визита мастера.", reveal: "как оставить заявку"}
  - {id: H-011, kind: FR, area: scenarios, priority: should, statement: "Жилец следит за статусом заявки и после выполнения оценивает работу от 1 до 5.", reveal: "статус и оценка заявки"}
  - {id: H-012, kind: FR, area: scenarios, priority: should, statement: "Объявление публикуется для одного или нескольких домов, и жильцы этих домов получают уведомление.", reveal: "рассылка объявлений"}
  - {id: H-013, kind: FR, area: scenarios, priority: could, statement: "Жилец видит историю своих показаний и начислений за 12 месяцев.", reveal: "история показаний и начислений"}
  - {id: H-014, kind: FR, area: scenarios, priority: should, statement: "Диспетчер видит заявки на карте района и фильтрует их по дому, типу и сроку.", reveal: "как диспетчер видит заявки"}
  - {id: H-015, kind: FR, area: scenarios, priority: could, statement: "Жилец записывается на приём к управляющему в офисе на свободное время.", reveal: "приём в офисе"}
  - {id: H-016, kind: FR, area: exceptions, priority: must, statement: "Если показание меньше прошлого или больше среднего в 3 раза, система просит жильца проверить его и приложить фото счётчика.", reveal: "ошибочные показания"}
  - {id: H-017, kind: FR, area: exceptions, priority: must, statement: "Если показания не переданы до 25 числа, начисление идёт по среднему, а 23 числа жилец получает напоминание.", reveal: "показания не переданы"}
  - {id: H-018, kind: FR, area: exceptions, priority: must, statement: "Аварийная заявка круглосуточно уходит аварийной службе, минуя общую очередь.", reveal: "аварии"}
  - {id: H-019, kind: FR, area: exceptions, priority: should, statement: "Если подрядчик просрочил заявку, о ней сообщают главному инженеру.", reveal: "подрядчик опоздал"}
  - {id: H-020, kind: FR, area: exceptions, priority: should, statement: "О плановом отключении воды или света жильцы затронутых домов узнают за 3 дня.", reveal: "плановые отключения"}
  - {id: H-021, kind: FR, area: exceptions, priority: could, statement: "Когда в квартире меняется собственник, прежний теряет доступ к лицевому счёту после регистрации нового.", reveal: "смена собственника"}
  - {id: H-022, kind: FR, area: data, priority: must, statement: "О лицевом счёте хранятся номер, адрес, площадь, число проживающих и собственники.", reveal: "данные лицевого счёта"}
  - {id: H-023, kind: FR, area: data, priority: must, statement: "О счётчике хранятся тип, заводской номер, дата поверки и история показаний.", reveal: "данные о счётчиках"}
  - {id: H-024, kind: FR, area: data, priority: must, statement: "Заявка хранит тип, описание, фото, дом и квартиру, исполнителя, сроки, статус и оценку жильца.", reveal: "данные заявки"}
  - {id: H-025, kind: FR, area: data, priority: should, statement: "Объявление хранит текст, дома, срок показа и автора.", reveal: "данные объявлений"}
  - {id: H-026, kind: FR, area: data, priority: should, statement: "О подрядчике хранятся название, договор, виды работ и контакты.", reveal: "данные о подрядчиках"}
  - {id: H-027, kind: FR, area: rules, priority: must, statement: "Показания принимаются с 20 по 25 число каждого месяца.", reveal: "когда передавать показания"}
  - {id: H-028, kind: FR, area: rules, priority: should, statement: "За 30 дней до окончания поверки счётчика жилец получает напоминание.", reveal: "поверка счётчиков"}
  - {id: H-029, kind: FR, area: rules, priority: must, statement: "Аварийная заявка выполняется за 2 часа, обычная — за 3 рабочих дня, подрядная — в срок по договору.", reveal: "нормативные сроки"}
  - {id: H-030, kind: FR, area: rules, priority: should, statement: "Лицевой счёт видят несколько жильцов, но передают показания только собственник и указанные им родственники.", reveal: "кто передаёт показания"}
  - {id: H-031, kind: FR, area: rules, priority: should, statement: "Оценка ниже 3 автоматически открывает проверку заявки главным инженером.", reveal: "низкие оценки"}
  - {id: H-032, kind: FR, area: integrations, priority: must, statement: "Показания и лицевые счета каждую ночь обмениваются с программой начислений 1С.", reveal: "связь с программой начислений"}
  - {id: H-033, kind: FR, area: integrations, priority: should, statement: "Показания раз в месяц передаются в ГИС ЖКХ.", reveal: "государственная система ЖКХ"}
  - {id: H-034, kind: NFR, area: nfr, priority: must, statement: "С 20 по 25 число кабинет выдерживает 1500 жильцов одновременно.", reveal: "нагрузка в дни показаний"}
  - {id: H-035, kind: NFR, area: nfr, priority: should, statement: "Передать показания с телефона можно за минуту.", reveal: "удобство"}
  - {id: H-036, kind: NFR, area: nfr, priority: must, statement: "При входе с нового устройства жилец подтверждает вход кодом из SMS.", reveal: "безопасность входа"}
  - {id: H-037, kind: NFR, area: nfr, priority: should, statement: "Резервная копия данных делается каждую ночь и хранится 30 дней.", reveal: "резервные копии, надёжность"}
  - {id: H-038, kind: NFR, area: nfr, priority: should, statement: "Кабинет работает в браузерах телефонов и компьютеров без установки приложения.", reveal: "устройства"}
  - {id: H-039, kind: CON, area: constraints, priority: must, in_brief: true, statement: "Персональные данные жильцов хранятся в России.", reveal: "где хранить данные"}
  - {id: H-040, kind: CON, area: constraints, priority: should, statement: "Бюджет — до 900 тысяч рублей, запуск — через 4 месяца.", reveal: "бюджет и сроки"}
