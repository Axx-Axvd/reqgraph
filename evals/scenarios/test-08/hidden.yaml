# Эталон test-08 (размер M): что знает заказчик. Черновик Claude (T-303), проверяет автор.
requirements:
  - {id: H-001, kind: BR, area: goals, priority: must, statement: "Средний чек гостя должен вырасти на 15% за год за счёт дополнительных услуг.", reveal: "цели, средний чек"}
  - {id: H-002, kind: BR, area: goals, priority: should, statement: "Через год половина броней — прямые, через свой сайт.", reveal: "цели, прямые брони"}
  - {id: H-003, kind: BR, area: goals, priority: should, statement: "Заселение на ресепшене занимает не больше 5 минут.", reveal: "цели, скорость заселения"}
  - {id: H-004, kind: UR, area: stakeholders, priority: must, in_brief: true, statement: "Гость бронирует номер и услуги онлайн.", reveal: "что делает гость"}
  - {id: H-005, kind: UR, area: stakeholders, priority: must, in_brief: true, statement: "Портье заселяет и выселяет гостей.", reveal: "работа портье"}
  - {id: H-006, kind: UR, area: stakeholders, priority: should, statement: "Горничные получают задания на уборку номеров на день.", reveal: "работа горничных"}
  - {id: H-007, kind: UR, area: stakeholders, priority: should, statement: "Менеджер мероприятий бронирует конференц-зал и номера для групп.", reveal: "мероприятия и группы"}
  - {id: H-008, kind: FR, area: scenarios, priority: must, in_brief: true, statement: "Гость выбирает категорию номера и даты.", reveal: "выбор номера"}
  - {id: H-009, kind: FR, area: scenarios, priority: should, statement: "Гость бронирует СПА-процедуры на конкретное время.", reveal: "бронирование СПА"}
  - {id: H-010, kind: FR, area: scenarios, priority: should, statement: "Гость заказывает ужин в номер, и сумма добавляется к счёту номера.", reveal: "ресторан и заказ в номер"}
  - {id: H-011, kind: FR, area: scenarios, priority: should, statement: "За сутки до заезда гость проходит онлайн-регистрацию и получает электронный ключ.", reveal: "онлайн-регистрация"}
  - {id: H-012, kind: FR, area: scenarios, priority: must, statement: "При выезде гость получает один счёт за проживание и все услуги.", reveal: "единый счёт"}
  - {id: H-013, kind: FR, area: scenarios, priority: should, statement: "Менеджер мероприятий оформляет групповую бронь с общим счётом для компании.", reveal: "групповые брони"}
  - {id: H-014, kind: FR, area: scenarios, priority: must, statement: "Горничная отмечает номер убранным, и портье видит, что номер готов.", reveal: "готовность номеров"}
  - {id: H-015, kind: FR, area: scenarios, priority: must, in_brief: true, statement: "Гость оплачивает бронь онлайн.", reveal: "оплата брони"}
  - {id: H-016, kind: FR, area: exceptions, priority: must, statement: "При перебронировании гостя переселяют в номер более высокой категории без доплаты.", reveal: "перебронирование"}
  - {id: H-017, kind: FR, area: exceptions, priority: must, statement: "Если гость не приехал, удерживается стоимость первой ночи.", reveal: "гость не приехал"}
  - {id: H-018, kind: FR, area: exceptions, priority: should, statement: "Поздний выезд до 18:00 стоит 50% суточной цены, если номер не забронирован дальше.", reveal: "поздний выезд"}
  - {id: H-019, kind: FR, area: exceptions, priority: should, statement: "Номер, которому нужен ремонт, снимается с продажи на нужные даты.", reveal: "ремонт номера"}
  - {id: H-020, kind: FR, area: exceptions, priority: should, statement: "Если СПА-мастер заболел, процедуры переносятся, а гости получают уведомление.", reveal: "мастер СПА заболел"}
  - {id: H-021, kind: FR, area: exceptions, priority: could, statement: "Забытые вещи регистрируются в журнале находок и хранятся 3 месяца.", reveal: "забытые вещи"}
  - {id: H-022, kind: FR, area: data, priority: must, statement: "У номера есть номер, категория, этаж, вместимость и состояние уборки и ремонта.", reveal: "данные номеров"}
  - {id: H-023, kind: FR, area: data, priority: must, statement: "Бронь хранит гостя, номер или категорию, даты, тариф, услуги, оплаты и статус.", reveal: "данные брони"}
  - {id: H-024, kind: FR, area: data, priority: must, statement: "О госте хранятся ФИО, контакты, документ, предпочтения и история проживаний.", reveal: "данные о госте"}
  - {id: H-025, kind: FR, area: data, priority: should, statement: "Счёт состоит из позиций проживания и услуг, скидок и оплат.", reveal: "данные счёта"}
  - {id: H-026, kind: FR, area: data, priority: should, statement: "У услуги есть название, цена, длительность и исполнитель.", reveal: "данные услуг"}
  - {id: H-027, kind: FR, area: rules, priority: must, statement: "Цена зависит от категории, сезона и дня недели, в праздники действует повышенный тариф.", reveal: "цены"}
  - {id: H-028, kind: FR, area: rules, priority: should, statement: "При проживании больше 7 ночей скидка 10%.", reveal: "скидки"}
  - {id: H-029, kind: FR, area: rules, priority: must, statement: "Бесплатная отмена — не позднее чем за 3 суток до заезда.", reveal: "правила отмены"}
  - {id: H-030, kind: FR, area: rules, priority: should, statement: "Дети до 6 лет без отдельного места проживают бесплатно.", reveal: "дети"}
  - {id: H-031, kind: FR, area: rules, priority: should, statement: "Бронь от 5 номеров считается групповой и оформляется по отдельному договору.", reveal: "групповые условия"}
  - {id: H-032, kind: FR, area: integrations, priority: must, statement: "Номерной фонд синхронизируется с агрегаторами через менеджер каналов.", reveal: "агрегаторы"}
  - {id: H-033, kind: FR, area: integrations, priority: should, statement: "Электронные ключи выдаются через систему замков отеля.", reveal: "замки и ключи"}
  - {id: H-034, kind: NFR, area: nfr, priority: should, statement: "Поиск свободных номеров занимает меньше 2 секунд.", reveal: "скорость поиска"}
  - {id: H-035, kind: NFR, area: nfr, priority: must, statement: "Ресепшен работает круглосуточно, доступность системы — 99,9%.", reveal: "доступность"}
  - {id: H-036, kind: NFR, area: nfr, priority: must, statement: "Данные документов гостей хранятся зашифрованными и видны только портье и администратору.", reveal: "защита данных"}
  - {id: H-037, kind: NFR, area: nfr, priority: should, statement: "Онлайн-регистрация занимает не больше 3 минут.", reveal: "удобство"}
  - {id: H-038, kind: NFR, area: nfr, priority: should, statement: "Сайт работает на русском и английском.", reveal: "языки"}
  - {id: H-039, kind: CON, area: constraints, priority: must, statement: "Иностранные гости ставятся на миграционный учёт в течение суток.", reveal: "миграционный учёт"}
  - {id: H-040, kind: CON, area: constraints, priority: must, in_brief: true, statement: "Данные гостей хранятся в России.", reveal: "где хранить данные"}
