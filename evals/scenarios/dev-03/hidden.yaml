# Эталон dev-03 (размер L): что знает заказчик. Черновик Claude (T-303), проверяет автор.
requirements:
  - {id: H-001, kind: BR, area: goals, priority: must, statement: "Очереди за книгами в начале семестра должны сократиться с часа до 10 минут.", reveal: "цели проекта, очереди", group: unique}
  - {id: H-002, kind: BR, area: goals, priority: should, statement: "Через полгода после запуска не меньше 70% броней оформляется онлайн.", reveal: "цели проекта, онлайн-бронирование", group: unique}
  - {id: H-003, kind: BR, area: goals, priority: should, statement: "Доля книг, возвращённых с просрочкой, должна снизиться с 25% до 10% за учебный год.", reveal: "цели проекта, просрочки", group: unique}
  - {id: H-004, kind: BR, area: goals, priority: could, statement: "Отчёт для ректората готовится за час вместо двух рабочих дней.", reveal: "цели заведующей, отчётность", group: unique}
  - {id: H-005, kind: UR, area: stakeholders, priority: must, in_brief: true, statement: "Студент ищет книгу в каталоге и бронирует её онлайн.", reveal: "что делает студент", group: typical}
  - {id: H-006, kind: UR, area: stakeholders, priority: should, statement: "Преподаватель заранее резервирует до 30 экземпляров учебника для своей группы на семестр.", reveal: "что нужно преподавателям", group: unique}
  - {id: H-007, kind: UR, area: stakeholders, priority: must, in_brief: true, statement: "Библиотекарь выдаёт и принимает книги по штрихкоду.", reveal: "работа библиотекаря", group: typical}
  - {id: H-008, kind: UR, area: stakeholders, priority: must, in_brief: true, statement: "Заведующая раз в квартал готовит отчёт о книговыдаче для ректората.", reveal: "работа заведующей", group: typical}
  - {id: H-009, kind: UR, area: stakeholders, priority: should, statement: "Сотрудник отдела комплектования вносит новые поступления в каталог и списывает ветхие книги.", reveal: "кто ведёт каталог, новые поступления", group: typical}
  - {id: H-010, kind: UR, area: stakeholders, priority: should, statement: "Сотрудник ИТ-отдела управляет ролями пользователей и настройками системы.", reveal: "администрирование системы", group: typical}
  - {id: H-011, kind: FR, area: scenarios, priority: must, in_brief: true, statement: "Каталог ищет по названию, автору и теме и показывает, сколько экземпляров свободно.", reveal: "поиск в каталоге", group: typical}
  - {id: H-012, kind: FR, area: scenarios, priority: must, in_brief: true, statement: "Бронь держится два рабочих дня, потом снимается автоматически.", reveal: "срок брони", group: typical}
  - {id: H-013, kind: FR, area: scenarios, priority: should, statement: "Когда забронированная книга готова к выдаче, читатель получает письмо на университетскую почту.", reveal: "уведомления о брони", group: typical}
  - {id: H-014, kind: FR, area: scenarios, priority: must, in_brief: true, statement: "Читатель один раз продлевает выдачу в личном кабинете, если на книгу нет очереди.", reveal: "продление выдачи", group: typical}
  - {id: H-015, kind: FR, area: scenarios, priority: should, statement: "Если свободных экземпляров нет, читатель встаёт в очередь и получает письмо, когда книгу вернули.", reveal: "книги нет в наличии, очередь", group: typical}
  - {id: H-016, kind: FR, area: scenarios, priority: should, statement: "За 3 дня до конца срока выдачи читатель получает напоминание на почту.", reveal: "напоминание о возврате", group: typical}
  - {id: H-017, kind: FR, area: scenarios, priority: should, statement: "В личном кабинете читатель видит книги на руках, сроки, брони, место в очереди и долг по пеням.", reveal: "личный кабинет читателя", group: typical}
  - {id: H-018, kind: FR, area: scenarios, priority: could, statement: "Читатель бронирует место в читальном зале на день и время, бронь места держится 30 минут после начала.", reveal: "читальный зал, места", group: unique}
  - {id: H-019, kind: FR, area: scenarios, priority: should, statement: "Справочники и редкий фонд выдаются только в читальный зал и на дом не бронируются.", reveal: "что нельзя взять домой", group: unique}
  - {id: H-020, kind: FR, area: scenarios, priority: must, statement: "При выдаче библиотекарь сканирует штрихкоды книги и читательского, а система проверяет, можно ли выдать.", reveal: "выдача книги по шагам", group: typical}
  - {id: H-021, kind: FR, area: scenarios, priority: should, in_brief: true, statement: "Из личного кабинета открывается доступ к электронным подпискам на журналы.", reveal: "электронные журналы", group: typical}
  - {id: H-022, kind: FR, area: scenarios, priority: could, statement: "Читатель предлагает книгу к закупке, заявки видит отдел комплектования.", reveal: "пожелания читателей, закупка книг", group: typical}
  - {id: H-023, kind: FR, area: exceptions, priority: must, statement: "Если книга утеряна или испорчена, читатель возмещает стоимость или приносит такую же, до этого новые книги ему не выдают.", reveal: "утеря или порча книги", group: unique}
  - {id: H-024, kind: FR, area: exceptions, priority: should, statement: "Выпускник за месяц до выпуска получает напоминание о долгах, без расчёта с библиотекой обходной лист не подписывается.", reveal: "выпускники и отчисление, обходной лист", group: unique}
  - {id: H-025, kind: FR, area: exceptions, priority: should, statement: "Если ночная сверка с 1С не прошла, система работает со вчерашним списком читателей и пишет администратору.", reveal: "сбой сверки с 1С", group: typical}
  - {id: H-026, kind: FR, area: exceptions, priority: should, statement: "Читатель, который трижды за семестр не пришёл за бронью, до конца семестра бронирует только через библиотекаря.", reveal: "не забрал бронь", group: unique}
  - {id: H-027, kind: FR, area: exceptions, priority: could, statement: "Если штрихкод не читается, библиотекарь находит экземпляр по инвентарному номеру.", reveal: "не читается штрихкод", group: typical}
  - {id: H-028, kind: FR, area: exceptions, priority: should, statement: "Без интернета библиотекарь продолжает выдачу, а операции загружаются в систему, когда связь вернётся.", reveal: "пропала связь", group: typical}
  - {id: H-029, kind: FR, area: exceptions, priority: should, statement: "Если на книгу есть очередь, продлить её нельзя, и читателю показывают дату возврата.", reveal: "продление при очереди", group: typical}
  - {id: H-030, kind: FR, area: exceptions, priority: could, statement: "Список должников с просрочкой больше 60 дней раз в месяц уходит в деканаты.", reveal: "давние должники", group: unique}
  - {id: H-031, kind: FR, area: exceptions, priority: could, statement: "Ошибочно начисленные пени заведующая отменяет с указанием причины.", reveal: "ошибки в пенях", group: typical}
  - {id: H-032, kind: FR, area: data, priority: must, statement: "О книге хранятся название, авторы, год, издательство, ISBN, тема по УДК, место хранения и число экземпляров.", reveal: "данные о книге", group: typical}
  - {id: H-033, kind: FR, area: data, priority: must, statement: "У каждого экземпляра есть инвентарный номер, штрихкод и состояние: на полке, выдан, забронирован, в ремонте, списан.", reveal: "экземпляры и их состояние", group: typical}
  - {id: H-034, kind: FR, area: data, priority: must, statement: "О читателе хранятся ФИО, номер билета или пропуска, институт или кафедра, группа, почта и статус: студент, преподаватель, сотрудник.", reveal: "данные о читателе", group: typical}
  - {id: H-035, kind: FR, area: data, priority: should, statement: "История выдач хранится 5 лет, потом обезличивается.", reveal: "сколько хранить историю", group: typical}
  - {id: H-036, kind: FR, area: data, priority: must, statement: "По каждой выдаче хранятся дата выдачи, срок, дата возврата, продление и библиотекарь.", reveal: "данные о выдаче", group: typical}
  - {id: H-037, kind: FR, area: data, priority: should, statement: "По каждой просроченной выдаче хранятся дни просрочки, сумма пени и отметка об оплате.", reveal: "учёт пеней", group: typical}
  - {id: H-038, kind: FR, area: data, priority: could, statement: "Для электронного журнала хранятся название, платформа, период подписки и ссылка.", reveal: "данные об электронных подписках", group: typical}
  - {id: H-039, kind: FR, area: data, priority: could, statement: "У места в читальном зале есть номер и тип: обычное, с компьютером, для слабовидящих.", reveal: "места в читальном зале", group: typical}
  - {id: H-040, kind: FR, area: rules, priority: must, in_brief: true, statement: "Срок выдачи — 30 дней для студентов и 90 для преподавателей.", reveal: "сроки выдачи", group: typical}
  - {id: H-041, kind: FR, area: rules, priority: must, in_brief: true, statement: "За просрочку начисляются пени 10 рублей в день.", reveal: "пени", group: typical}
  - {id: H-042, kind: FR, area: rules, priority: must, in_brief: true, statement: "Должнику новые книги не выдают.", reveal: "должники", group: typical}
  - {id: H-043, kind: FR, area: rules, priority: should, statement: "Студент держит на руках не больше 10 книг, преподаватель — не больше 30.", reveal: "сколько книг можно взять", group: typical}
  - {id: H-044, kind: FR, area: rules, priority: should, statement: "Пени не начисляются за дни, когда библиотека закрыта: выходные и каникулы.", reveal: "как считаются пени", group: unique}
  - {id: H-045, kind: FR, area: rules, priority: should, statement: "У читателя одновременно не больше 3 броней.", reveal: "сколько броней можно", group: typical}
  - {id: H-046, kind: FR, area: rules, priority: could, statement: "Очередь на книгу идёт по порядку, но преподаватель имеет приоритет на учебники своих курсов.", reveal: "порядок очереди", group: unique}
  - {id: H-047, kind: FR, area: rules, priority: should, statement: "Пени оплачиваются в кассе библиотеки или онлайн, после оплаты запрет на выдачу снимается сразу.", reveal: "оплата пеней", group: typical}
  - {id: H-048, kind: FR, area: integrations, priority: must, in_brief: true, statement: "Список студентов и сотрудников каждую ночь сверяется с 1С:Университет.", reveal: "связь с 1С", group: typical}
  - {id: H-049, kind: FR, area: integrations, priority: should, statement: "Читатели входят через единый вход университета по номеру студенческого билета или пропуска.", reveal: "вход в личный кабинет", group: typical}
  - {id: H-050, kind: FR, area: integrations, priority: could, statement: "Онлайн-оплата пеней идёт через платёжный шлюз университета.", reveal: "онлайн-оплата", group: typical}
  - {id: H-051, kind: NFR, area: nfr, priority: must, in_brief: true, statement: "Сайт доступен слабовидящим.", reveal: "доступность для слабовидящих", group: typical}
  - {id: H-052, kind: NFR, area: nfr, priority: must, in_brief: true, statement: "В начале семестра сайт выдерживает несколько сотен человек одновременно.", reveal: "нагрузка в начале семестра", group: typical}
  - {id: H-053, kind: NFR, area: nfr, priority: should, statement: "Система доступна 99% учебного времени, плановые работы — только ночью.", reveal: "доступность и плановые работы", group: typical}
  - {id: H-054, kind: NFR, area: nfr, priority: should, statement: "Библиотекари и администраторы входят с двухфакторной аутентификацией.", reveal: "безопасность входа", group: typical}
  - {id: H-055, kind: NFR, area: nfr, priority: should, statement: "Сроки выдачи, размер пеней и лимиты меняются в настройках без программиста.", reveal: "изменение правил", group: typical}
  - {id: H-056, kind: NFR, area: nfr, priority: could, statement: "Каталог работает в последних двух версиях популярных браузеров и на телефонах.", reveal: "браузеры и устройства", group: typical}
  - {id: H-057, kind: NFR, area: nfr, priority: should, statement: "Выдача одной книги по штрихкоду занимает у библиотекаря не больше 10 секунд.", reveal: "скорость выдачи", group: typical}
  - {id: H-058, kind: CON, area: constraints, priority: must, in_brief: true, statement: "Персональные данные читателей хранятся на серверах университета.", reveal: "где хранить данные", group: typical}
  - {id: H-059, kind: CON, area: constraints, priority: must, in_brief: true, statement: "Бюджет первой версии — 1,5 млн рублей.", reveal: "бюджет", group: typical}
  - {id: H-060, kind: CON, area: constraints, priority: must, in_brief: true, statement: "Запуск — к началу весеннего семестра.", reveal: "сроки запуска", group: typical}
  - {id: H-061, kind: FR, area: rules, priority: should, statement: "Если срок возврата выпадает на день, когда библиотека закрыта, он переносится на ближайший рабочий день.", reveal: "срок возврата в выходной", source: "PURE:2009-library#5057", group: typical}
  - {id: H-062, kind: FR, area: rules, priority: should, statement: "Заведующая может в обход правил разрешить бронь или выдачу, например читателю с долгом, но обязательно записывает причину.", reveal: "исключения из правил выдачи", source: "PURE:2009-library#5190", group: unique}
  - {id: H-063, kind: FR, area: scenarios, priority: should, statement: "Новые поступления не видны читателям в каталоге, пока отдел комплектования не закончит их описание и не опубликует.", reveal: "новые книги в каталоге", source: "PURE:2009-library#5278", group: typical}
  - {id: H-064, kind: FR, area: exceptions, priority: should, statement: "Ошибочно удалённую запись о книге или читателе можно восстановить: все удаления записываются в журнал.", reveal: "ошибочное удаление записи", source: "PURE:2009-library#6505", group: typical}
  - {id: H-065, kind: FR, area: stakeholders, priority: could, statement: "Заведующая видит на экране, сколько книг выдано и принято за последний час и сколько броней оформлено за день, по каждому залу отдельно.", reveal: "текущая загрузка библиотеки", source: "PURE:2009-library#6503", group: typical}
