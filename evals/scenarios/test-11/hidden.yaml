# Эталон test-11 (размер M): что знает заказчик. Черновик Claude (T-303), проверяет автор.
requirements:
  - {id: H-001, kind: BR, area: goals, priority: must, statement: "99,5% заказов собираются без ошибок.", reveal: "цели, точность сборки"}
  - {id: H-002, kind: BR, area: goals, priority: must, statement: "От поступления заказа до отгрузки проходит меньше 24 часов.", reveal: "цели, скорость"}
  - {id: H-003, kind: BR, area: goals, priority: should, statement: "Новый продавец подключается за день вместо недели.", reveal: "цели, подключение продавцов"}
  - {id: H-004, kind: UR, area: stakeholders, priority: must, in_brief: true, statement: "Продавец видит свои остатки и заказы в личном кабинете.", reveal: "что делает продавец"}
  - {id: H-005, kind: UR, area: stakeholders, priority: must, in_brief: true, statement: "Кладовщик принимает, размещает и собирает товары.", reveal: "работа кладовщика"}
  - {id: H-006, kind: UR, area: stakeholders, priority: should, statement: "Начальник смены распределяет задания между кладовщиками.", reveal: "работа начальника смены"}
  - {id: H-007, kind: UR, area: stakeholders, priority: should, statement: "Бухгалтер выставляет продавцам счета за хранение и операции.", reveal: "расчёты с продавцами"}
  - {id: H-008, kind: FR, area: scenarios, priority: must, in_brief: true, statement: "Продавец создаёт заявку на поставку товара на склад.", reveal: "заявка на поставку"}
  - {id: H-009, kind: FR, area: scenarios, priority: must, statement: "При приёмке кладовщик сверяет поставку с заявкой и наклеивает на товары штрихкоды склада.", reveal: "приёмка"}
  - {id: H-010, kind: FR, area: scenarios, priority: should, statement: "Система предлагает ячейку для размещения по размеру товара и свободному месту.", reveal: "размещение"}
  - {id: H-011, kind: FR, area: scenarios, priority: must, statement: "Кладовщик собирает заказы волной, а маршрут по складу строится по ячейкам.", reveal: "сборка заказов"}
  - {id: H-012, kind: FR, area: scenarios, priority: must, statement: "Собранные заказы упаковываются и отгружаются на склады маркетплейсов по графику.", reveal: "отгрузка"}
  - {id: H-013, kind: FR, area: scenarios, priority: should, statement: "Продавец заказывает возврат своих товаров со склада.", reveal: "вывоз товара продавцом"}
  - {id: H-014, kind: FR, area: scenarios, priority: should, statement: "Начальник смены видит выработку каждого кладовщика за смену.", reveal: "выработка"}
  - {id: H-015, kind: FR, area: scenarios, priority: should, statement: "Продавец получает ежемесячный отчёт об операциях и их стоимости.", reveal: "отчёты продавцу"}
  - {id: H-016, kind: FR, area: exceptions, priority: must, statement: "Товар с браком помещается в зону брака, продавец получает фото и решает, что с ним делать.", reveal: "брак при приёмке"}
  - {id: H-017, kind: FR, area: exceptions, priority: must, statement: "Если ячейка при сборке пустая, система предлагает другую ячейку с тем же товаром и создаёт задание на пересчёт.", reveal: "пустая ячейка"}
  - {id: H-018, kind: FR, area: exceptions, priority: should, statement: "Если маркетплейс не принял поставку, товары возвращаются на склад, а продавец получает уведомление.", reveal: "отказ маркетплейса"}
  - {id: H-019, kind: FR, area: exceptions, priority: should, statement: "Если продавец не оплатил счёт 30 дней, отгрузки его товаров приостанавливаются.", reveal: "долг продавца"}
  - {id: H-020, kind: FR, area: exceptions, priority: should, statement: "За 30 дней до истечения срока годности товара продавец получает предупреждение.", reveal: "срок годности"}
  - {id: H-021, kind: FR, area: exceptions, priority: must, statement: "Если кладовщик отсканировал не тот товар, сборка блокируется до исправления.", reveal: "ошибка при сборке"}
  - {id: H-022, kind: FR, area: data, priority: must, statement: "О товаре хранятся продавец, артикул, штрихкоды, габариты, вес, срок годности и признак маркировки.", reveal: "данные товара"}
  - {id: H-023, kind: FR, area: data, priority: must, statement: "У ячейки есть адрес — зона, стеллаж, полка, — размеры и содержимое.", reveal: "данные ячеек"}
  - {id: H-024, kind: FR, area: data, priority: must, statement: "У заказа есть маркетплейс, продавец, состав, срок отгрузки и статус.", reveal: "данные заказа"}
  - {id: H-025, kind: FR, area: data, priority: should, statement: "Каждая операция хранит тип — приёмка, хранение, сборка, упаковка, отгрузка, — продавца, количество и цену.", reveal: "учёт операций"}
  - {id: H-026, kind: FR, area: data, priority: should, statement: "О продавце хранятся реквизиты, договор, тариф и контакты.", reveal: "данные о продавцах"}
  - {id: H-027, kind: FR, area: rules, priority: must, statement: "Хранение оплачивается за литр в сутки, операции — по тарифу продавца.", reveal: "тарифы"}
  - {id: H-028, kind: FR, area: rules, priority: should, statement: "Товары со сроком годности отгружаются по правилу «первым истекает — первым уходит».", reveal: "порядок отгрузки"}
  - {id: H-029, kind: FR, area: rules, priority: must, statement: "Маркированный товар отгружается только после сканирования кода маркировки.", reveal: "маркировка"}
  - {id: H-030, kind: FR, area: rules, priority: should, statement: "Заказ, поступивший до 14:00, отгружается в тот же день.", reveal: "сроки отгрузки"}
  - {id: H-031, kind: FR, area: rules, priority: should, statement: "В одной ячейке хранятся товары только одного продавца.", reveal: "правила хранения"}
  - {id: H-032, kind: FR, area: integrations, priority: must, statement: "Заказы и поставки синхронизируются с кабинетами продавцов на маркетплейсах через их API.", reveal: "маркетплейсы"}
  - {id: H-033, kind: FR, area: integrations, priority: must, statement: "Коды маркировки проверяются в государственной системе маркировки «Честный знак».", reveal: "проверка маркировки"}
  - {id: H-034, kind: NFR, area: nfr, priority: must, statement: "В пик склад обрабатывает до 5000 заказов в день, терминал кладовщика отвечает быстрее секунды.", reveal: "нагрузка"}
  - {id: H-035, kind: NFR, area: nfr, priority: must, statement: "Склад работает в две смены, простой системы — не больше 30 минут в месяц.", reveal: "доступность"}
  - {id: H-036, kind: NFR, area: nfr, priority: must, statement: "Продавец видит только свои товары и заказы.", reveal: "разграничение доступа"}
  - {id: H-037, kind: NFR, area: nfr, priority: should, statement: "Новый кладовщик осваивает терминал за одну смену.", reveal: "простота обучения"}
  - {id: H-038, kind: NFR, area: nfr, priority: should, statement: "Работа на складе идёт на терминалах Android со встроенным сканером.", reveal: "оборудование"}
  - {id: H-039, kind: CON, area: constraints, priority: must, in_brief: true, statement: "Маркированные товары обрабатываются по правилам обязательной маркировки.", reveal: "законы о маркировке"}
  - {id: H-040, kind: CON, area: constraints, priority: should, statement: "Запуск — за 5 месяцев, бюджет — 3 млн рублей.", reveal: "бюджет и сроки"}
