# Эталон dev-02 (размер M): что знает заказчик. Черновик Claude (T-303), проверяет автор.
requirements:
  - {id: H-001, kind: BR, area: goals, priority: must, statement: "Доля потерянных и ошибочных заказов должна снизиться до 1% за 3 месяца после запуска.", reveal: "цели проекта, потерянные заказы"}
  - {id: H-002, kind: BR, area: goals, priority: must, statement: "Доля доставок с опозданием больше 30 минут должна снизиться до 5% за 3 месяца.", reveal: "цели проекта, опоздания курьеров"}
  - {id: H-003, kind: BR, area: goals, priority: should, statement: "Менеджер тратит на один заказ не больше минуты вместо нынешних 5–7.", reveal: "работа менеджера, экономия времени"}
  - {id: H-004, kind: UR, area: stakeholders, priority: must, in_brief: true, statement: "Курьер видит список своих заказов на день с адресами и отмечает «доставлено».", reveal: "работа курьера"}
  - {id: H-005, kind: UR, area: stakeholders, priority: must, in_brief: true, statement: "Менеджер видит все заказы и их статусы.", reveal: "работа менеджера"}
  - {id: H-006, kind: UR, area: stakeholders, priority: should, statement: "Пекарь на точке видит, сколько каких изделий собрать к каждому интервалу доставки.", reveal: "кто ещё работает с заказами, производство"}
  - {id: H-007, kind: UR, area: stakeholders, priority: should, statement: "Владелец меняет цены и состав каталога и смотрит отчёт о продажах.", reveal: "кто управляет каталогом и ценами"}
  - {id: H-008, kind: FR, area: scenarios, priority: must, in_brief: true, statement: "Клиент выбирает выпечку в каталоге с ценами и фото и кладёт её в корзину.", reveal: "заказ на сайте"}
  - {id: H-009, kind: FR, area: scenarios, priority: must, in_brief: true, statement: "Клиент выбирает часовой интервал доставки.", reveal: "время доставки"}
  - {id: H-010, kind: FR, area: scenarios, priority: must, in_brief: true, statement: "Клиент платит картой онлайн или наличными курьеру.", reveal: "оплата заказа"}
  - {id: H-011, kind: FR, area: scenarios, priority: must, statement: "Заказ на сегодня принимается не позже чем за 2 часа до выбранного интервала, на завтра — до 21:00.", reveal: "до какого времени можно заказать"}
  - {id: H-012, kind: FR, area: scenarios, priority: should, statement: "После оформления клиент получает SMS с номером заказа и интервалом, а за 30 минут до приезда — SMS о том, что курьер выехал.", reveal: "уведомления клиенту"}
  - {id: H-013, kind: FR, area: scenarios, priority: should, statement: "Менеджер распределяет заказы между курьерами, система предлагает распределение по районам.", reveal: "как заказ попадает к курьеру"}
  - {id: H-014, kind: FR, area: scenarios, priority: should, in_brief: true, statement: "Офис повторяет прошлый заказ одной кнопкой.", reveal: "заказы офисов"}
  - {id: H-015, kind: FR, area: scenarios, priority: should, in_brief: true, statement: "Офисы платят по счёту раз в месяц.", reveal: "оплата для офисов"}
  - {id: H-016, kind: FR, area: exceptions, priority: should, statement: "Если изделия нет в наличии, менеджер звонит клиенту и предлагает замену; без согласия клиента замену не делают.", reveal: "товара нет в наличии"}
  - {id: H-017, kind: FR, area: exceptions, priority: should, statement: "Если клиента нет дома, курьер ждёт 10 минут и звонит, потом заказ возвращается на точку; повторная доставка платная.", reveal: "клиента нет дома"}
  - {id: H-018, kind: FR, area: exceptions, priority: must, statement: "Отменить заказ бесплатно можно до начала сборки — за 2 часа до интервала; потом деньги за оплаченный заказ не возвращаются.", reveal: "отмена заказа клиентом"}
  - {id: H-019, kind: FR, area: exceptions, priority: must, statement: "Если онлайн-оплата не прошла, заказ не уходит в сборку, а клиенту предлагают повторить оплату или выбрать наличные.", reveal: "ошибка оплаты"}
  - {id: H-020, kind: FR, area: exceptions, priority: should, statement: "Если курьер не вышел, менеджер переназначает его заказы, а клиенты с перенесённым интервалом получают SMS.", reveal: "курьер заболел или не вышел"}
  - {id: H-021, kind: FR, area: exceptions, priority: could, statement: "Жалобу на качество или опоздание клиент оставляет на сайте, менеджер отвечает в течение рабочего дня.", reveal: "жалобы клиентов"}
  - {id: H-022, kind: FR, area: data, priority: must, statement: "О клиенте хранятся имя, телефон, адреса доставки и история заказов, у офиса — ещё реквизиты организации.", reveal: "данные о клиенте"}
  - {id: H-023, kind: FR, area: data, priority: must, statement: "У заказа есть состав, сумма, интервал, адрес, способ оплаты, курьер и статус: новый, собирается, в пути, доставлен, отменён.", reveal: "данные заказа, статусы"}
  - {id: H-024, kind: FR, area: data, priority: should, statement: "У каждого изделия есть название, цена, вес, состав, аллергены и фото.", reveal: "описание изделий в каталоге"}
  - {id: H-025, kind: FR, area: data, priority: should, statement: "Для каждой точки хранятся адрес, часы работы и остатки изделий на день.", reveal: "точки и остатки"}
  - {id: H-026, kind: FR, area: data, priority: could, statement: "Сохраняется история смены статусов заказа: когда и кто изменил.", reveal: "история изменений заказа"}
  - {id: H-027, kind: FR, area: rules, priority: must, in_brief: true, statement: "Минимальная сумма заказа — 700 рублей.", reveal: "минимальный заказ"}
  - {id: H-028, kind: FR, area: rules, priority: must, in_brief: true, statement: "Доставка бесплатная при заказе от 2000 рублей, иначе стоит 250 рублей.", reveal: "стоимость доставки"}
  - {id: H-029, kind: FR, area: rules, priority: must, in_brief: true, statement: "Доставка только в пределах города.", reveal: "зона доставки"}
  - {id: H-030, kind: FR, area: rules, priority: should, statement: "Заказ собирает ближайшая к адресу точка, если там есть все изделия, иначе — вторая точка.", reveal: "какая точка собирает заказ"}
  - {id: H-031, kind: FR, area: rules, priority: should, statement: "В один часовой интервал курьер везёт не больше 4 заказов.", reveal: "загрузка курьеров"}
  - {id: H-032, kind: FR, area: integrations, priority: must, statement: "Онлайн-оплата идёт через интернет-эквайринг банка пекарни, чеки по 54-ФЗ пробивает онлайн-касса.", reveal: "банк, касса, чеки"}
  - {id: H-033, kind: FR, area: integrations, priority: should, statement: "Заказы и оплаты выгружаются в 1С:Бухгалтерию раз в сутки.", reveal: "бухгалтерия и учёт"}
  - {id: H-034, kind: NFR, area: nfr, priority: must, in_brief: true, statement: "Сайт выдерживает субботний пик: до 120 заказов за утро и до 300 посетителей одновременно.", reveal: "нагрузка в пик"}
  - {id: H-035, kind: NFR, area: nfr, priority: should, statement: "Оформить заказ с телефона можно за 3 минуты без регистрации.", reveal: "удобство заказа"}
  - {id: H-036, kind: NFR, area: nfr, priority: should, statement: "Сайт доступен 99,5% времени, а в субботу с 7 до 12 плановых работ не бывает.", reveal: "доступность сайта"}
  - {id: H-037, kind: NFR, area: nfr, priority: must, statement: "Данные карт в системе не хранятся: оплата проходит на странице банка.", reveal: "безопасность оплаты"}
  - {id: H-038, kind: NFR, area: nfr, priority: should, statement: "Курьер работает с заказами в браузере телефона на Android и iOS без установки приложения.", reveal: "на каких телефонах работают курьеры"}
  - {id: H-039, kind: CON, area: constraints, priority: must, in_brief: true, statement: "Данные клиентов хранятся в России.", reveal: "где хранить данные"}
  - {id: H-040, kind: CON, area: constraints, priority: should, statement: "Первую версию нужно запустить за 3 месяца с бюджетом до 600 тысяч рублей.", reveal: "сроки и бюджет"}
