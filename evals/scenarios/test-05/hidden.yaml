# Эталон test-05 (размер M): что знает заказчик. Черновик Claude (T-303), проверяет автор.
requirements:
  - {id: H-001, kind: BR, area: goals, priority: must, statement: "Доля продлённых абонементов должна вырасти с 50% до 65% за год.", reveal: "цели, продления"}
  - {id: H-002, kind: BR, area: goals, priority: should, statement: "Продажи персональных тренировок должны вырасти на 20% за полгода.", reveal: "цели, персональные тренировки"}
  - {id: H-003, kind: BR, area: goals, priority: should, statement: "Очередь на ресепшене в вечерний пик — не больше 3 минут.", reveal: "цели, очереди"}
  - {id: H-004, kind: UR, area: stakeholders, priority: must, in_brief: true, statement: "Клиент проходит в клуб по карте или QR-коду.", reveal: "проход в клуб"}
  - {id: H-005, kind: UR, area: stakeholders, priority: must, in_brief: true, statement: "Тренер ведёт расписание персональных тренировок.", reveal: "работа тренера"}
  - {id: H-006, kind: UR, area: stakeholders, priority: should, statement: "Менеджер по продажам ведёт заявки будущих клиентов и пробные визиты.", reveal: "продажи"}
  - {id: H-007, kind: UR, area: stakeholders, priority: should, statement: "Администратор ресепшена продаёт абонементы и выдаёт ключи от шкафчиков.", reveal: "работа ресепшена"}
  - {id: H-008, kind: FR, area: scenarios, priority: must, in_brief: true, statement: "Клиент записывается на групповое занятие в приложении.", reveal: "запись на групповые"}
  - {id: H-009, kind: FR, area: scenarios, priority: must, in_brief: true, statement: "Клиент покупает или продлевает абонемент онлайн.", reveal: "покупка абонемента"}
  - {id: H-010, kind: FR, area: scenarios, priority: must, statement: "Клиент записывается на персональную тренировку к выбранному тренеру на свободное время.", reveal: "запись к тренеру"}
  - {id: H-011, kind: FR, area: scenarios, priority: must, statement: "Турникет проверяет, действует ли абонемент, а на входе в бассейн — есть ли запись.", reveal: "проход через турникет"}
  - {id: H-012, kind: FR, area: scenarios, priority: should, statement: "Клиент замораживает абонемент в приложении.", reveal: "заморозка абонемента"}
  - {id: H-013, kind: FR, area: scenarios, priority: should, statement: "Менеджер записывает будущего клиента на пробный визит и через 2 дня после визита получает напоминание перезвонить.", reveal: "пробные визиты"}
  - {id: H-014, kind: FR, area: scenarios, priority: could, statement: "Клиент видит в приложении, насколько сейчас заполнен зал.", reveal: "загруженность зала"}
  - {id: H-015, kind: FR, area: scenarios, priority: should, statement: "За 10 дней до конца абонемента клиент получает предложение продлить его со скидкой.", reveal: "предложение продлить"}
  - {id: H-016, kind: FR, area: exceptions, priority: must, statement: "Если клиент не пришёл на персональную тренировку и не отменил её за 12 часов, тренировка списывается.", reveal: "клиент не пришёл к тренеру"}
  - {id: H-017, kind: FR, area: exceptions, priority: must, statement: "Если турникет не работает, администратор отмечает вход вручную, и это попадает в журнал.", reveal: "турникет сломался"}
  - {id: H-018, kind: FR, area: exceptions, priority: should, statement: "Если за 2 часа до группового занятия записано меньше 3 человек, его можно отменить, предупредив записанных.", reveal: "мало записавшихся"}
  - {id: H-019, kind: FR, area: exceptions, priority: should, statement: "Если тренер уволился, его будущие тренировки с согласия клиента переносятся к другому тренеру.", reveal: "тренер уволился"}
  - {id: H-020, kind: FR, area: exceptions, priority: must, statement: "Если оплата не прошла, абонемент не активируется, а клиент получает ссылку для повторной оплаты.", reveal: "ошибка оплаты"}
  - {id: H-021, kind: FR, area: exceptions, priority: could, statement: "Администратор блокирует клиента, нарушившего правила клуба, с указанием причины.", reveal: "нарушение правил"}
  - {id: H-022, kind: FR, area: data, priority: must, statement: "О клиенте хранятся ФИО, телефон, дата рождения, фото для пропуска и медицинские ограничения.", reveal: "данные о клиенте"}
  - {id: H-023, kind: FR, area: data, priority: must, statement: "У абонемента есть тип, зоны — зал, бассейн, групповые, — срок, заморозки и цена.", reveal: "данные абонемента"}
  - {id: H-024, kind: FR, area: data, priority: should, statement: "У каждого посещения хранятся время входа и выхода и зона.", reveal: "данные посещений"}
  - {id: H-025, kind: FR, area: data, priority: should, statement: "О тренере хранятся специализация, расписание и стоимость часа.", reveal: "данные тренеров"}
  - {id: H-026, kind: FR, area: data, priority: should, statement: "У заявки будущего клиента есть имя, телефон, источник, статус и менеджер.", reveal: "данные о будущих клиентах"}
  - {id: H-027, kind: FR, area: rules, priority: must, statement: "Заморозка — до 30 дней в год, частями не меньше 7 дней.", reveal: "правила заморозки"}
  - {id: H-028, kind: FR, area: rules, priority: should, statement: "Детский абонемент — с 7 лет, в бассейне до 12 лет ребёнок занимается только с родителем.", reveal: "дети в клубе"}
  - {id: H-029, kind: FR, area: rules, priority: must, statement: "Персональную тренировку можно отменить бесплатно не позднее чем за 12 часов.", reveal: "отмена тренировки"}
  - {id: H-030, kind: FR, area: rules, priority: should, statement: "Утренний абонемент действует только в будни до 16:00.", reveal: "виды абонементов"}
  - {id: H-031, kind: FR, area: rules, priority: could, statement: "Тренер получает 40% стоимости персональной тренировки.", reveal: "оплата тренеров"}
  - {id: H-032, kind: FR, area: integrations, priority: must, statement: "Система управляет турникетами клуба.", reveal: "турникеты"}
  - {id: H-033, kind: FR, area: integrations, priority: should, statement: "Продажи выгружаются в 1С, чеки пробивает онлайн-касса.", reveal: "учёт продаж"}
  - {id: H-034, kind: NFR, area: nfr, priority: must, statement: "Проверка на турникете занимает не больше секунды.", reveal: "скорость прохода"}
  - {id: H-035, kind: NFR, area: nfr, priority: must, statement: "Без интернета турникеты пропускают по последнему загруженному списку абонементов.", reveal: "работа без интернета"}
  - {id: H-036, kind: NFR, area: nfr, priority: should, statement: "Записаться на занятие в приложении можно за 30 секунд.", reveal: "удобство приложения"}
  - {id: H-037, kind: NFR, area: nfr, priority: must, statement: "Медицинские ограничения клиента видят только его тренеры и администратор.", reveal: "кто видит медицинские данные"}
  - {id: H-038, kind: NFR, area: nfr, priority: should, statement: "Приложение работает на iOS 15 и Android 9 и новее.", reveal: "телефоны клиентов"}
  - {id: H-039, kind: CON, area: constraints, priority: must, in_brief: true, statement: "Используются уже установленные турникеты, менять их не будем.", reveal: "ограничения по оборудованию"}
  - {id: H-040, kind: CON, area: constraints, priority: should, statement: "Запуск — к 1 сентября, бюджет — 1,2 млн рублей.", reveal: "сроки и бюджет"}
